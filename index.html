                // 後半段：解除鎖定，讓玩家從 2 張手牌中拖曳 1 張到戰場打出並結算（不結束回合）
                lockRef.current = false;
                setActionLocked(false);
                setSelectedHandCard(null);
                setBroadcastResult('➔ 請拖曳 1 張手牌到戰場打出');
              } else {
                logActionAndResult('你 打出了(6)【掘墓人】', '沒有任何效果（沒有可選擇目標）', '你');
                advanceTurn();
              }
            } else if (type === 'BOUNTY_HUNTER') {
              resolveBounty(`你 對 ${targetId === humanPlayerId ? '自己' : target.name} 打出了(5)【賞金獵人】`, '你', humanPlayerId, targetId);
            } else if (type === 'SEER') {
              const targetHand = playerHands[targetId] || [];
              const cName = targetHand[0] ? targetHand[0].title : '無';
              const cVal = targetHand[0] ? targetHand[0].value : '?';
              // 公開播「秘密檢視」動畫（不揭露牌面）；牌面結果僅先知私密可見
              logActionAndResult(
                `你 對 ${target.name} 打出了(2)【先知】`,
                `秘密檢視結果 ➔ ${target.name} 手牌為 ${cName}(${cVal})`,
                '你',
                null,
                '',
                {
                  privateTo: [humanPlayerId],
                  privateFx: false,
                  publicAction: `你 對 ${target.name} 打出了(2)【先知】`,
                  publicResult: '秘密檢視完成',
                }
              );
              setSeerSeen(targetHand[0] ? { targetId, card: targetHand[0] } : null);
              setInteractionModal({ type: 'INFO', title: '先知檢視結果', infoCard: targetHand[0] || null, infoTarget: target });
              return;
              advanceTurn();
            } else if (type === 'TAX_COLLECTOR') {
              const targetHand = playerHands[targetId] || [];
              const targetVal = targetHand[0] ? targetHand[0].value : '?';
              const isHit = targetHand.some(c => c.value === 0 || c.value === 1);
              logActionAndResult(
                `你 對 ${target.name} 打出了(2)【稅務官】審查`,
                isHit ? `${target.name}(${targetVal})手牌符合 ➔ 宣佈出局！` : `審查失敗 ➔ ${target.name} 手牌非 0 或 1`,
                '你'
              );
              if (isHit) eliminatePlayer(targetId, humanPlayerId, '稅務官審查出局');
              advanceTurn();
            } else if (type === 'INQUISITOR') {
              const targetHand = playerHands[targetId] || [];
              const targetVal = targetHand[0] ? targetHand[0].value : '?';
              const isHit = targetHand.some(c => c.value === 9 || c.value === 10);
              logActionAndResult(
                `你 對 ${target.name} 打出了(2)【審判官】審判`,
                isHit ? `${target.name}(${targetVal})手牌符合 ➔ 宣佈出局！` : `審判失敗 ➔ ${target.name} 手牌非 9 或 10`,
                '你'
              );
              if (isHit) eliminatePlayer(targetId, humanPlayerId, '審判官審判出局');
              advanceTurn();
            } else if (type === 'BARKEEPER' || type === 'GIRL') {
              const sHand = (playerHands[humanPlayerId] || [])[0];
              const tHand = (playerHands[targetId] || [])[0];
              const cName = type === 'BARKEEPER' ? '酒保' : '小女孩';
              const compareAction = `你 對 ${target.name} 打出了(3)【${cName}】${type === 'BARKEEPER' ? '比大' : '比小'}`;
              const reportComparison = (resultText) => logActionAndResult(
                compareAction,
                resultText,
                '你'
              );
              if (sHand && tHand) {
                if (type === 'BARKEEPER') {
                  if (sHand.value < tHand.value) {
                    reportComparison('你手牌較小出局！');
                    eliminatePlayer(humanPlayerId, targetId, '酒保比大出局');
                  } else if (tHand.value < sHand.value) {
                    reportComparison(`${target.name}手牌較小出局！`);
                    eliminatePlayer(targetId, humanPlayerId, '酒保比大出局');
                  } else {
                    reportComparison('雙方數值相同，平手無事發生');
                  }
                } else {
                  if (sHand.value > tHand.value) {
                    reportComparison('你手牌較大出局！');
                    eliminatePlayer(humanPlayerId, targetId, '小女孩比小出局');
                  } else if (tHand.value > sHand.value) {
                    reportComparison(`${target.name}手牌較大出局！`);
                    eliminatePlayer(targetId, humanPlayerId, '小女孩比小出局');
                  } else {
                    reportComparison('雙方數值相同，平手無事發生');
                  }
                }
              }
              advanceTurn();
            } else if (type === 'THIEF' || type === 'SWAP_HAND') {
              const sHand = playerHands[humanPlayerId] || [];
              const tHand = playerHands[targetId] || [];
              setPlayerHands(prev => ({ ...prev, [humanPlayerId]: tHand, [targetId]: sHand }));
              const selfP = players.find(p => p.id === humanPlayerId) || { id: humanPlayerId, name: '你' };
              const swapMeta = buildSwapMeta(selfP, sHand, target, tHand);
              const thiefViewers = [...new Set([humanPlayerId, targetId])];
              logActionAndResult(
                `你 對 ${target.name} 打出了(7)【小偷】`,
                formatSwapResultForViewer('手牌交換成功！獲得額外回合', swapMeta, humanPlayerId),
                '你',
                null,
                '',
                {
                  privateTo: thiefViewers,
                  privateFx: true,
                  publicAction: `你 對 ${target.name} 打出了(7)【小偷】`,
                  publicResult: '秘密交換手牌，獲得額外回合',
                  swapMeta,
                }
              );
              setExtraTurnPlayerId(humanPlayerId);
              advanceTurn();
            } else if (type === 'PICKPOCKET') {
              const t1 = players.find(p => p.id === targetId);
              const t2 = players.find(p => p.id === secondaryTargetId);
              const t1Hand = playerHands[targetId] || [];
              const t2Hand = playerHands[secondaryTargetId] || [];
              setPlayerHands(prev => ({ ...prev, [targetId]: t2Hand, [secondaryTargetId]: t1Hand }));
              const pickViewers = [...new Set([humanPlayerId, targetId, secondaryTargetId])];
              const swapMeta = buildSwapMeta(t1, t1Hand, t2, t2Hand);
              logActionAndResult(
                `你 打出了(6)【扒手】`,
                formatSwapResultForViewer(`秘密交換了 ${t1.name} 與 ${t2.name} 的手牌`, swapMeta, humanPlayerId),
                '你',
                null,
                '',
                { privateTo: pickViewers, privateFx: true, publicAction: '你 打出了(6)【扒手】', publicResult: `秘密交換了 ${t1.name} 與 ${t2.name} 的手牌`, swapMeta }
              );
              advanceTurn();
            } else if (type === 'WITCH') {
              const deadTargets = players.filter(p => p.status === '出局');
              if (deadTargets.length > 0 && targetId !== undefined && target) {
                const drawn = drawCardForPlayer(targetId, false) || takeReserveCard();
                setPlayerHands(prev => ({ ...prev, [targetId]: drawn ? [drawn] : [] }));
                setPlayers(prev => prev.map(p => p.id === targetId ? { ...p, status: '存活', protected: false } : p));
                setWitchTargetOwner({ witchOwnerId: humanPlayerId, targetId });
                logActionAndResult(`你 打出了(4)【女巫】`, `復活了 ${target.name} ➔ 綁定共同勝利`, '你', 'revive');
              } else {
                logActionAndResult('你 打出了(4)【女巫】', '沒有任何效果（沒有可選擇目標）', '你');
              }
              advanceTurn();
            } else if (type === 'COUNTER_SPY') {
              const attacker = players.find(p => p.id === payload.attackerId);
              const attackerHand = playerHands[payload.attackerId] || [];
              logActionAndResult(
                '你 打出了(7)【間諜】',
                `反殺猜測者 ${attacker.name}！該玩家淘汰並奪取其手牌${gotCardsText(attackerHand, [])}`,
                '你',
                null,
                '',
                { privateTo: [humanPlayerId], publicResult: `反殺猜測者 ${attacker.name}！該玩家出局，手牌已被接手` }
              );
              eliminatePlayer(payload.attackerId, humanPlayerId, '間諜反殺出局', true);
              const spyC = (playerHands[humanPlayerId] || []).find(c => c && c.type === 'SPY');
              if (spyC) setPlayers(prev => prev.map(p => p.id === humanPlayerId ? { ...p, playedCards: [...playedCardsOf(p), spyC] } : p));
              setHandNow(payload.attackerId, []);    // 被淘汰者的手牌已被接手，不再留在他手上
              setHandNow(humanPlayerId, attackerHand.filter(Boolean));
              // advanceTurn 內部會處理鎖定與換人，確保在 eliminatePlayer 之後執行
              advanceTurn();
            }
          };

          const proceedToNext = (forceExtra = null) => {
            lockRef.current = false;
            setActionLocked(false);
            const st = stateRef.current;
            const extra = forceExtra !== null ? forceExtra : st.extraTurnPlayerId;
            let nextIdx;
            if (extra !== null && st.players[extra] && st.players[extra].status === '存活') nextIdx = extra;
            else nextIdx = getNextAliveIndex(st.currentTurnIndex, st.players);
            setExtraTurnPlayerId(null);
            turnSeqRef.current += 1;
            // 保鏢：下個回合開始時解除保護
            setPlayers(prev => prev.map(p => p.id === nextIdx ? { ...p, protected: false } : p));
            setCurrentTurnIndex(nextIdx);
            setTurnTick(t => t + 1);
            setAiKick(k => k + 1);
          };
          // 換人時一律解鎖，避免出牌後 actionLocked 卡住無法抽牌
          useEffect(() => {
            lockRef.current = false;
            setActionLocked(false);
          }, [currentTurnIndex]);

          const useServant = (pid, servantId) => {
            const p = stateRef.current.players.find(x => x.id === pid);
            setPlayers(prev => prev.map(x => x.id === pid ? { ...x, playedCards: playedCardsOf(x).filter(c => !(c && c.id === servantId)) } : x));
            // 動畫播放期間先鎖住操作，播完才開始額外回合
            lockRef.current = true;
            setActionLocked(true);
            logActionAndResult(`${p.name} 棄掉面前【僕人】`, '立刻進行額外回合！', p.name);
            whenFxDone(() => {
              if (gameOverRef.current) return;
              proceedToNext(pid);
            }, 250);
          };

          const advanceTurn = () => {
            const st0 = stateRef.current;
            const active = st0.players[st0.currentTurnIndex];
            if (onlineSession && active && (
              active.isAI
                ? !roomData || roomData.hostUid !== (firebaseUser && firebaseUser.uid)
                : active.uid !== (firebaseUser && firebaseUser.uid)
            )) return;

            lockRef.current = true;
            setActionLocked(true);
            // AI 出牌後多留時間給玩家看動畫；人類出牌後較短
            // 注意：只等動畫 duration（whenFxDone），不等人點 sticky；點擊只影響本機畫面
            const baseDelay = 500; // 留一個短緩衝讓狀態先 commit，之後換人
            whenFxDone(() => {
              lockRef.current = false;
              setActionLocked(false);
              if (gameOverRef.current) return;
              reserveDrawRef.current = null;
              if (checkWinConditions()) return;
              const st = stateRef.current;
              const cur = st.players[st.currentTurnIndex];
              if (cur && cur.status === '存活' && st.extraTurnPlayerId === null) {
                const servant = playedCardsOf(cur).find(c => c && c.type === 'SERVANT');
                if (servant) {
                  if (cur.isAI) { useServant(cur.id, servant.id); return; }
                  setInteractionModal({ type: 'SERVANT_CHOICE', title: '僕人', servantId: servant.id });
                  return;
                }
              }
              proceedToNext();
            }, baseDelay);
          };

          // 被動／置於面前類（含煉金術士、商人、叛徒等）：動畫可 sticky 等人點，但換人必須依時長推進（不依賴點擊）
          // 換人前保持鎖定，避免出牌後還能再按「抽一打一」；另加安全網避免 whenFxDone 異常卡死
          const advanceAfterPassive = () => {
            const st0 = stateRef.current;
            const active = st0.players[st0.currentTurnIndex];
            const isAi = !!(active && active.isAI);
            if (onlineSession && active && (
              isAi
                ? !roomData || roomData.hostUid !== (firebaseUser && firebaseUser.uid)
                : active.uid !== (firebaseUser && firebaseUser.uid)
            )) return;

            lockRef.current = true;
            setActionLocked(true);
            // AI 被動牌：等動畫時長後立刻換人（略短於一般 AI 延遲，避免像卡死）
            const delay = 500;
            let finished = false;
            const finish = () => {
              if (finished) return;
              finished = true;
              lockRef.current = false;
              setActionLocked(false);
              if (gameOverRef.current) return;
              reserveDrawRef.current = null;
              if (checkWinConditions()) return;
              proceedToNext(); // 內部會再解鎖
            };
            whenFxDone(finish, delay);
            // 安全網：被動牌（煉金術士等）最多再等約 8 秒必換人，避免卡死
            setTimeout(finish, Math.max(delay + 2500, 8000 * slow()));
          };

          useEffect(() => {
            if (gameOver) return;

            // 牌庫耗盡不在此處結算：須等當前玩家打出手牌、回合結束後由 advanceTurn → checkWinConditions 處理

            const currentPlayer = players[currentTurnIndex];
            if (!currentPlayer) return;

            if (currentPlayer.status === '出局') {
              advanceTurn();
              return;
            }

            if (currentPlayer.isAI) {
              if (onlineSession && (!roomData || roomData.hostUid !== (firebaseUser && firebaseUser.uid))) return;
              if (pausedRef.current) { pendingAiRef.current = true; return; }
              // AI 行動只等動畫 duration，不等人點 sticky；點擊只清畫面
              const cancelAiWait = whenFxDone(async () => {
                if (pausedRef.current) { pendingAiRef.current = true; return; }
                pendingAiRef.current = false;
                const myToken = ++aiRunRef.current;
                const mySeq = turnSeqRef.current;
                const stale = () => gameOverRef.current || aiRunRef.current !== myToken || stateRef.current.currentTurnIndex !== currentTurnIndex || turnSeqRef.current !== mySeq;
                const sleep = (ms) => new Promise(r => setTimeout(r, ms));
                const pid = currentPlayer.id;
                if (stale()) return;

                let hand = (stateRef.current.playerHands[pid] || []).filter(Boolean);
                let drawnCard = null;
                while (hand.length < 2 && stateRef.current.deck.length > 0) {
                  if (stale()) return;
                  if (hand.length === 1 && stateRef.current.centerCards.some(Boolean) && Math.random() < 0.25) {
                    aiCenterSwap(pid);
                    return;
                  }
                  const result = drawTurnCard(pid);
                  if (result.gameEnded || gameOverRef.current) return;
                  if (result.card) { drawnCard = result.card; break; }
                  if (result.moon) {
                    await new Promise(r => whenFxDone(r, 800));
                    while (pausedRef.current && !stale()) await sleep(300);
                    if (stale()) return;
                    continue;
                  }
                  break;
                }

                if (!drawnCard && hand.length < 2 && reserveDrawRef.current === pid && stateRef.current.deck.length === 0) {
                  const rc = drawReserveCard();
                  if (rc) {
                    const nm = stateRef.current.players.find(p => p.id === pid).name;
                    logActionAndResult(`${nm} 從備用牌抽牌`, '牌庫已空 ➔ 抽 1 張備用牌', nm);
                    drawnCard = rc;
                  }
                }

                if (stale()) return;
                if (drawnCard) {
                  hand = [...hand, drawnCard];
                  setHandNow(pid, hand);
                }

                if (hand.length >= 2) {
                  const safeCard = aiPickCard(hand);
                  if (safeCard) executePlayPhase(pid, safeCard);
                  else advanceTurn();
                } else {
                  advanceTurn();
                }
              }, 500 * slow(), true);

              return () => { cancelAiWait(); };
            }
          }, [currentTurnIndex, gameOver, aiKick]);

          const myHand = playerHands[humanPlayerId] || [];
          resolveRef.current = resolveCardEffect;

          // 面前的牌：該玩家所有打出（或被公開）而放在面前的牌；同一張牌只列一次
          const getFrontCards = (p) => {
            const map = new Map();
            const order = [];
            (p.playedCards || []).forEach((c, idx) => {
              if (!c) return;
              const key = c.id || `${c.title}-${idx}`;
              const prev = map.get(key);
              if (!prev) order.push(key);
              map.set(key, { ...c, revealedBy: c.revealedBy || (prev && prev.revealedBy) });
            });
            return order.map(k => map.get(k));
          };

          // 長期有效、仍在作用的牌 ➔ 標示「生效中」：僕人、商人、煉金術士、保鏢（保護期間）、
          // 仍握在手上的賞金獵人公開牌、女巫（復活者仍綁定時）
          const isCardActive = (p, c) => {
            if (!p || !c || p.status !== '存活') return false;
            if (c.type === 'SERVANT' || c.title === '商人' || c.title === '煉金術士') return true;
            if (c.type === 'BODYGUARD') return !!p.protected;
            if (c.revealedBy === 'BOUNTY') return (playerHands[p.id] || []).some(h => h && h.id === c.id);
            if (c.title === '女巫') return !!witchTargetOwner && witchTargetOwner.witchOwnerId === p.id;
            return false;
          };

          const handleNextGame = async () => {
            // 本機試玩：一人即開始
            if (!onlineSession || !roomData || !firebaseUser || !roomRef.current) {
              if (winnerInfo && winnerInfo.matchWinners && winnerInfo.matchWinners.length > 0) {
                winsRef.current = {};
                setWins({});
              }
              initGame();
              return;
            }
            if (nextGameBusy) return;
            // 只有本局已結束才能準備下一局（避免殘留／誤觸的準備旗標在對局中被算進去）
            if (!(roomData.gameState && roomData.gameState.gameOver)) return;
            // 任何仍在房間的真人（含已出局）皆可準備；只寫入自己的 nextReady/{uid}，避免非房主對整房 transaction 被 rules 拒絕
            const myUid = firebaseUser.uid;
            if (!(roomData.players || {})[myUid]) {
              setLobbyError('你不在此房間，無法準備下一局。');
              return;
            }
            if ((roomData.nextReady || {})[myUid]) return;
            setNextGameBusy(true);
            try {
              await firebase.database().ref(`rooms/${roomCode}/nextReady/${myUid}`).set(true);
            } catch (error) {
              setLobbyError(`準備下一局失敗：${error.message}`);
              setBroadcastAction('無法準備下一局');
              setBroadcastResult(`➔ ${error.message}`);
            } finally {
              setNextGameBusy(false);
            }
          };

          // 殘留的「已準備」旗標：本局尚未結束（或新局已開始）時，清掉自己的旗標，避免上一局／斷線重送的準備被算進這一局
          useEffect(() => {
            if (!onlineSession || !roomData || !firebaseUser || !roomCode || !window.firebase) return;
            const myUid = firebaseUser.uid;
            if (!(roomData.nextReady && roomData.nextReady[myUid])) return;
            if (roomData.gameState && roomData.gameState.gameOver) return;
            firebase.database().ref(`rooms/${roomCode}/nextReady/${myUid}`).remove().catch(() => {});
          }, [onlineSession, roomCode, firebaseUser, roomData && roomData.nextReady, roomData && roomData.gameState && roomData.gameState.gameOver]);

          // 房主偵測全員準備後開新局（僅房主可寫房間根欄位 round／gameState）
          useEffect(() => {
            if (!onlineSession || !roomData || !firebaseUser || !roomRef.current || !roomCode) return;
            if (roomData.hostUid !== firebaseUser.uid) return;
            if (roomData.status !== 'playing') return;
            if (!(roomData.gameState && roomData.gameState.gameOver)) return; // 本局未結束 → 一律不開新局
            const humans = Object.keys(roomData.players || {});
            if (!humans.length) return;
            const nextReady = roomData.nextReady || {};
            if (!humans.every(uid => nextReady[uid])) return;
            let cancelled = false;
            (async () => {
              try {
                const result = await roomRef.current.transaction(current => {
                  if (!current || current.status !== 'playing') return;
                  if (!(current.gameState && current.gameState.gameOver)) return;
                  const h = Object.keys(current.players || {});
                  if (!h.length) return;
                  const nr = current.nextReady || {};
                  if (!h.every(uid => nr[uid])) return;
                  return {
                    ...current,
                    nextReady: null,
                    round: (current.round || 0) + 1,
                    gameState: null,
                  };
                });
                if (cancelled) return;
                if (result.committed) {
                  const after = result.snapshot && result.snapshot.val();
                  if (after && !after.gameState && winnerInfo && winnerInfo.matchWinners && winnerInfo.matchWinners.length > 0) {
                    winsRef.current = {};
                    setWins({});
                  }
                  // 全員準備後立刻由房主發牌（不單靠 roomData 訂閱／round effect，避免整場結束後 Guest 卡在「等待房主發牌」）
                  const roster = (after && after.gamePlayers) || (roomData && roomData.gamePlayers) || INITIAL_PLAYERS;
                  setTimeout(() => {
                    if (cancelled) return;
                    if (gameRevisionRef.current > 0) return;
                    initGame(roster);
                  }, 80);
                }
              } catch (error) {
                if (!cancelled) {
                  console.error('開下一局失敗：', error);
                  setLobbyError(`開下一局失敗：${error.message}`);
                }
              }
            })();
            return () => { cancelled = true; };
          }, [onlineSession, roomCode, firebaseUser, roomData && roomData.hostUid, roomData && roomData.status, roomData && roomData.nextReady, roomData && roomData.players, roomData && roomData.gameState && roomData.gameState.gameOver]);
          const onlineHumans = roomData ? Object.keys(roomData.players || {}) : [];
          const nextReadyMap = (roomData && roomData.nextReady) || {};
          const iAmReadyNext = !!(firebaseUser && nextReadyMap[firebaseUser.uid]);
          const nextReadyCount = onlineHumans.filter(uid => nextReadyMap[uid]).length;
          const allReadyNext = onlineSession && onlineHumans.length > 0 && nextReadyCount >= onlineHumans.length;
          const canStartNextGame = !onlineSession || !!(firebaseUser && onlineHumans.includes(firebaseUser.uid));
          const nextGameLabel = nextGameBusy
            ? '處理中…'
            : !onlineSession
              ? ((winnerInfo && winnerInfo.matchWinners && winnerInfo.matchWinners.length > 0) ? '開始新的一場' : '下一局')
              : iAmReadyNext
                ? (allReadyNext ? '即將開始…' : `已準備 ${nextReadyCount}/${onlineHumans.length}`)
                : ((winnerInfo && winnerInfo.matchWinners && winnerInfo.matchWinners.length > 0)
                  ? `準備新的一場（${nextReadyCount}/${onlineHumans.length}）`
                  : `準備下一局（${nextReadyCount}/${onlineHumans.length}）`);

          // 結算後攤牌：單張牌的小標籤
          const revealChip = (c, key) => c ? (
            <span key={key} className="inline-flex items-center bg-slate-800 border border-amber-500/40 rounded px-1.5 py-0.5 text-[10.5px] whitespace-nowrap">{numEmoji(c.value)}<b className="font-black text-amber-300 ml-0.5">{c.title}</b></span>
          ) : (
            <span key={key} className="inline-flex items-center bg-slate-800/50 border border-dashed border-slate-600 rounded px-1.5 py-0.5 text-[10px] text-slate-500 whitespace-nowrap">已取走</span>
          );

          if (screen !== 'game') {
            const humans = roomData ? Object.values(roomData.players || {}).sort((a, b) => a.joinedAt - b.joinedAt) : [];
            const aiCount = roomData ? roomData.aiCount || 0 : 0;
            const totalPlayers = humans.length + aiCount;
            const isHost = !!(roomData && firebaseUser && roomData.hostUid === firebaseUser.uid);
            return (
              <div className="min-h-[100dvh] w-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
                <div className="w-full max-w-md">
                  <div className="text-center mb-6">
                    <div className="text-4xl mb-2">🌙</div>
                    <h1 className="text-3xl font-black tracking-widest text-amber-300">狼月</h1>
                    <p className="text-xs text-slate-400 mt-1">Wolf Moon · 線上多人版</p>
                    <p className="text-[10px] font-mono font-bold text-cyan-400/90 mt-1.5 tracking-tight">{version}</p>
                  </div>
                  <div className="flex items-center justify-center gap-2 mb-5 text-[10px] font-bold">
                    {['1 名稱／房間', '2 等待大廳', '3 遊戲'].map((label, index) => (
                      <div key={label} className={`rounded-full px-2.5 py-1 border ${index === (screen === 'home' ? 0 : 1) ? 'border-amber-400/70 bg-amber-500/15 text-amber-200' : 'border-slate-700 text-slate-500'}`}>{label}</div>
                    ))}
                  </div>
                  <div className="rounded-2xl border border-slate-700 bg-slate-900/90 p-5 shadow-2xl">
                    {screen === 'home' ? (
                      <>
                        <label className="block text-xs font-bold text-slate-300 mb-1.5" htmlFor="player-name">玩家名稱</label>
                        <input
                          id="player-name"
                          value={displayName}
                          onChange={event => { setDisplayName(event.target.value); setLobbyError(''); }}
                          onKeyDown={event => { if (event.key === 'Enter' && firebaseStatus === 'ready') createRoom(); }}
                          maxLength={16}
                          placeholder="輸入 1–16 字名稱"
                          className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-3 text-sm text-white outline-none focus:border-amber-400"
                        />
                        <button
                          onClick={createRoom}
                          disabled={lobbyBusy || firebaseStatus !== 'ready'}
                          className="w-full mt-4 rounded-xl bg-amber-500 py-3 text-sm font-black text-slate-950 disabled:opacity-40"
                        >{lobbyBusy ? '處理中…' : '建立房間'}</button>
                        <div className="my-4 flex items-center gap-3 text-[10px] text-slate-500"><span className="h-px flex-1 bg-slate-700"></span>或加入朋友的房間<span className="h-px flex-1 bg-slate-700"></span></div>
                        <div className="flex gap-2">
                          <input
                            value={roomInput}
                            onChange={event => { setRoomInput(event.target.value.replace(/\D/g, '').slice(0, 6)); setLobbyError(''); }}
                            maxLength={6}
                            inputMode="numeric"
                            pattern="[0-9]*"
                            placeholder="6 位數字房間號碼"
                            aria-label="房間號碼"
                            className="min-w-0 flex-1 rounded-xl border border-slate-700 bg-slate-950 px-3 py-3 text-center font-mono text-lg tracking-[0.3em] text-white outline-none focus:border-cyan-400"
                          />
                          <button
                            onClick={joinRoom}
                            disabled={lobbyBusy || firebaseStatus !== 'ready'}
                            className="rounded-xl border border-cyan-500/50 bg-cyan-950/60 px-4 text-sm font-black text-cyan-200 disabled:opacity-40"
                          >加入</button>
                        </div>
                        {firebaseStatus === 'setup' && (
                          <div className="mt-4 rounded-xl border border-amber-500/40 bg-amber-950/30 p-3 text-[11px] leading-relaxed text-amber-100">
                            Firebase 尚未設定。請先依 read.md 建立 Firebase 專案、啟用匿名登入與 Realtime Database，再填入本頁的 Web App config。
                          </div>
                        )}
                        {firebaseStatus === 'connecting' && <p className="mt-3 text-center text-[10px] text-slate-400">正在連接 Firebase…</p>}
                        {firebaseStatus === 'error' && <p className="mt-3 text-center text-[10px] text-rose-300">Firebase 連線失敗，請檢查設定與網路。</p>}
                        <button onClick={() => { setOnlineSession(false); setScreen('game'); }} className="w-full mt-4 py-2 text-[11px] font-bold text-slate-400 underline underline-offset-4">本機試玩（不連線）</button>
                      </>
                    ) : (
                      <>
                        <div className="flex items-center justify-between">
                          <div>
                            <div className="text-xs text-slate-400">房間號碼</div>
                            <div className="font-mono text-3xl font-black tracking-[0.25em] text-amber-300">{roomCode}</div>
                          </div>
                          <button onClick={() => navigator.clipboard.writeText(roomCode).catch(error => setLobbyError(`複製房間號碼失敗：${error.message}`))} className="rounded-lg border border-slate-700 px-3 py-2 text-xs font-bold text-slate-300">複製</button>
                        </div>
                        <div className="mt-4 flex items-center justify-between border-t border-slate-800 pt-4">
                          <h2 className="text-sm font-black text-white">等待大廳</h2>
                          <span className={`text-xs font-black ${totalPlayers >= 3 ? 'text-emerald-300' : 'text-amber-300'}`}>{totalPlayers} / 6 人</span>
                        </div>
                        {/* AI 調整固定在名單上方，避免增減時按鈕跟著下移 */}
                        {isHost && roomData.status === 'lobby' && (
                          <div className="mt-3 flex items-center justify-between rounded-xl border border-slate-700 p-3">
                            <div>
                              <div className="text-xs font-bold">AI 玩家</div>
                              <div className="text-[10px] text-slate-400">總玩家數需為 3–6 人</div>
                            </div>
                            <div className="flex items-center gap-3">
                              <button onClick={() => updateAiCount(-1)} disabled={aiCount <= 0} className="h-8 w-8 rounded-lg bg-slate-700 font-black disabled:opacity-30" aria-label="減少 AI">−</button>
                              <span className="w-4 text-center font-mono font-black">{aiCount}</span>
                              <button onClick={() => updateAiCount(1)} disabled={totalPlayers >= 6} className="h-8 w-8 rounded-lg bg-slate-700 font-black disabled:opacity-30" aria-label="增加 AI">＋</button>
                            </div>
                          </div>
                        )}
                        <div className="mt-2 space-y-2 max-h-[40vh] overflow-y-auto pr-0.5 scrollbar-none">
                          {humans.map(person => (
                            <div key={person.uid} className="flex items-center justify-between rounded-lg bg-slate-800/70 px-3 py-2 text-sm">
                              <span className="truncate">{person.name}</span>
                              {person.uid === roomData.hostUid && <span className="ml-2 text-[10px] font-bold text-amber-300">房主</span>}
                            </div>
                          ))}
                          {Array.from({ length: aiCount }, (_, index) => (
                            <div key={`ai-${index}`} className="flex items-center justify-between rounded-lg bg-slate-800/40 px-3 py-2 text-sm text-cyan-200">
                              <span>AI {index + 1}</span><span className="text-[10px]">電腦玩家</span>
                            </div>
                          ))}
                        </div>
                        {isHost && roomData.status === 'lobby' && (
                          <button onClick={startOnlineGame} disabled={totalPlayers < 3 || totalPlayers > 6} className="w-full mt-4 rounded-xl bg-emerald-500 py-3 text-sm font-black text-slate-950 disabled:cursor-not-allowed disabled:opacity-35">開始遊戲</button>
                        )}
                        {roomData.status === 'playing' && (
                          <div className="mt-4 space-y-2">
                            <p className="text-center text-[11px] text-amber-200 font-bold">本局進行中或已結束</p>
                            <button onClick={() => setScreen('game')} className="w-full rounded-xl bg-cyan-600 py-3 text-sm font-black text-white active:scale-95">返回牌桌</button>
                            {(roomData.gameState && roomData.gameState.gameOver) ? (
                              <button
                                onClick={handleNextGame}
                                disabled={nextGameBusy || iAmReadyNext}
                                className="w-full rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 py-3 text-sm font-black text-slate-950 disabled:cursor-not-allowed disabled:opacity-60 active:scale-95"
                              >{nextGameLabel}</button>
                            ) : null}
                          </div>
                        )}
                        {!isHost && roomData.status === 'lobby' && (
                          <p className="mt-4 text-center text-xs text-slate-400">等待房主開始遊戲…</p>
                        )}
                        <button onClick={leaveRoom} className="w-full mt-3 py-2 text-[11px] font-bold text-rose-300">離開房間</button>
                      </>
                    )}
                    {lobbyError && <p role="alert" className="mt-3 rounded-lg bg-rose-950/50 p-2 text-[11px] text-rose-200">{lobbyError}</p>}
                  </div>
                  <p className="mt-3 text-center text-[9px] text-slate-600">休閒同步模式：介面會遮蔽他人私密資訊，但熟悉瀏覽器工具的玩家仍可能讀取同步資料。</p>
                </div>
              </div>
            );
          }

          const privateBroadcastVisible = !!(broadcastPrivate && broadcastPrivate.playerIds?.includes(humanPlayerId));
          const visibleBroadcastAction = privateBroadcastVisible ? broadcastPrivate.action : broadcastAction;
          // 動態私密行依本機玩家從 swapMeta／drunkMeta 重新組裝，避免同步到出牌者個人化後的「你換出／換入」
          const visibleBroadcastResult = privateBroadcastVisible
            ? (broadcastPrivate.drunkMeta
                ? `➔ ${formatDrunkResultForViewer(String(broadcastPrivate.result || '').replace(/^➔\s*/, '').split('｜')[0], broadcastPrivate.drunkMeta, humanPlayerId)}`
                : broadcastPrivate.swapMeta
                  ? `➔ ${formatSwapResultForViewer(String(broadcastPrivate.result || '').replace(/^➔\s*/, '').split('｜')[0], broadcastPrivate.swapMeta, humanPlayerId)}`
                  : broadcastPrivate.result)
            : broadcastResult;
          const visibleBroadcastReveal = privateBroadcastVisible ? broadcastPrivate.reveal : broadcastReveal;
          const visibleWatchNote = watchNote?.byPlayer
            ? watchNote.byPlayer[humanPlayerId] || null
            : (watchNote?.ownerId === humanPlayerId ? watchNote : null);
          const visibleHistoryLogs = historyLogs.map(log => {
            const privateView = log.privateView && log.privateView.playerIds?.includes(humanPlayerId) ? log.privateView : null;
            const privateFx = log.privateFx?.privateTo?.includes(humanPlayerId) ? log.privateFx : null;
            const legacySecret = !log.privateView && PRIVATE_TEXT_PATTERN.test(`${log.action || ''} ${log.result || log.card || ''}`);
            const personalizedResult = privateView
              ? (privateView.swapMeta
                  ? formatSwapResultForViewer(privateView.result.split('｜')[0], privateView.swapMeta, humanPlayerId)
                  : privateView.drunkMeta
                    ? formatDrunkResultForViewer(privateView.result.split('｜')[0], privateView.drunkMeta, humanPlayerId)
                    : privateView.result)
              : (legacySecret ? '私密行動已完成' : log.result);
            return {
              ...log,
              action: privateView ? privateView.action : log.action,
              result: personalizedResult,
              reveal: privateView ? privateView.reveal : log.reveal,
              card: legacySecret ? (log.action || '私密行動已完成') : log.card,
              fx: legacySecret ? null : (privateFx || log.fx),
              isPrivateForViewer: !!privateView,
            };
          });

          // 線上模式尚未收到牌局：顯示等待，避免誤顯示預設 6 人 AI 空桌
          if (onlineSession && !gameReady) {
            return (
              <div className="min-h-[100dvh] h-[100dvh] w-screen flex flex-col items-center justify-center bg-slate-950 text-slate-100 p-6 text-center">
                <div className="text-4xl mb-3 animate-pulse">🌙</div>
                <p className="text-sm font-black text-amber-300 mb-1">正在同步牌局…</p>
                <p className="text-[11px] text-slate-400 mb-4">等待房主發牌與狀態同步</p>
                <p className="text-[10px] font-mono text-cyan-400/80 mb-6">{version}{roomCode ? ` · 房 ${roomCode}` : ''}</p>
                <button
                  onClick={() => setScreen('lobby')}
                  className="rounded-xl border border-slate-600 bg-slate-900 px-4 py-2 text-xs font-bold text-slate-300"
                >返回大廳</button>
              </div>
            );
          }

          return (
            <div className="min-h-[100dvh] h-[100dvh] w-screen flex flex-col justify-between overflow-hidden bg-slate-950 text-slate-100 select-none touch-manipulation pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)] pl-[env(safe-area-inset-left)] pr-[env(safe-area-inset-right)]">
              
              <div className="mobile-container h-full w-full max-w-[480px] mx-auto flex flex-col justify-between bg-gradient-to-b from-slate-900 via-slate-950 to-slate-900 relative">

                {/* A區: 頂部狀態列 */}
                <header className="h-[4.5%] min-h-[32px] bg-slate-900/90 backdrop-blur border-b border-cyan-900/40 px-3 flex items-center justify-between z-[80] shrink-0">
                  <div className="flex items-center">
                    <span className="text-[10px] font-mono font-bold text-cyan-400 tracking-tight">
                      {version}
                    </span>

                    <button onClick={() => setIsHistoryModalOpen(false)} className="w-full mt-3 shrink-0 bg-slate-800 hover:bg-slate-700 text-purple-300 text-xs py-2 rounded-xl border border-slate-700 transition">
                      關閉
                    </button>
                  </div>
                </div>
              )}

              {/* 長按放大的手牌（放開即關閉） */}
              {zoomCard && (
                <div className="fixed inset-0 z-[75] flex items-center justify-center bg-slate-950/70 pointer-events-none">
                  <div className="w-[250px] h-[360px] bg-slate-900 border-2 border-cyan-400 rounded-2xl p-4 flex flex-col justify-between shadow-[0_0_30px_rgba(6,182,212,0.5)]">
                    <div className="flex justify-between items-center">
                      <span className="bg-cyan-500 text-slate-950 text-xl font-black w-10 h-10 rounded-full flex items-center justify-center font-mono">{zoomCard.value}</span>
                      <span className="text-[11px] text-slate-400 font-bold">{zoomCard.category}</span>
                    </div>
                    <div className="w-full h-32 bg-slate-800/90 rounded-xl border border-slate-700/60 flex items-center justify-center my-2">
                      <i className={`fa-solid ${zoomCard.icon} text-6xl text-cyan-400 filter drop-shadow`}></i>
                    </div>
                    <div className="text-center">
                      <div className="text-xl font-black text-slate-100 tracking-wide">{zoomCard.title}</div>
                      <div className="text-sm text-slate-300 leading-snug mt-2">{zoomCard.desc}</div>
                    </div>
                  </div>
                </div>
              )}

              {/* 拖曳中的手牌（浮動，不影響版面） */}
              {dragGhost && (
                <div className="fixed z-[70] pointer-events-none" style={{ left: dragGhost.x, top: dragGhost.y, transform: 'translate(-50%, -60%) rotate(-3deg) scale(0.9)' }}>
                  <div className={`w-[130px] h-[190px] bg-slate-900 border-2 rounded-xl p-2 flex flex-col justify-between shadow-2xl ${dragGhost.over ? 'border-emerald-400 shadow-[0_0_22px_rgba(52,211,153,0.7)]' : 'border-amber-400'}`}>
                    <div className="flex justify-between items-center">
                      <span className="bg-amber-500 text-slate-950 text-sm font-black w-6 h-6 rounded-full flex items-center justify-center font-mono">{dragGhost.card.value}</span>
                    </div>
                    <div className="w-full h-16 bg-slate-800/90 rounded-lg border border-slate-700/60 flex items-center justify-center my-1">
                      <i className={`fa-solid ${dragGhost.card.icon} text-3xl text-amber-400`}></i>
                    </div>
                    <div className="text-center">
                      <div className="text-xs font-black text-slate-100 truncate">{dragGhost.card.title}</div>
                      <div className="text-[8.5px] text-slate-300 line-clamp-3 leading-tight mt-0.5">{dragGhost.card.desc}</div>
                    </div>
                  </div>
                </div>
              )}

              {/* 彈窗：玩家面前的牌 */}
              {viewPlayerId !== null && (() => {
                const vp = players.find(p => p.id === viewPlayerId);
                if (!vp) return null;
                const cards = getFrontCards(vp);
                const isTarget = witchTargetOwner && witchTargetOwner.targetId === vp.id;
                const isOwner = witchTargetOwner && witchTargetOwner.witchOwnerId === vp.id;
                const ownerName = witchTargetOwner ? (players.find(p => p.id === witchTargetOwner.witchOwnerId) || {}).name : '';
                const targetName = witchTargetOwner ? (players.find(p => p.id === witchTargetOwner.targetId) || {}).name : '';
                return (
                  <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setViewPlayerId(null)}>

                      <div className="flex justify-between items-center border-b border-slate-800 pb-2 mb-2">
                        <h3 className="text-sm font-bold text-cyan-300">{vp.name} 面前的牌 <span className="text-[10px] text-slate-400 font-normal">（共 {cards.length} 張）</span></h3>
                        <button onClick={() => setViewPlayerId(null)} className="text-slate-400 hover:text-white text-base"><i className="fa-solid fa-xmark"></i></button>
                      </div>
                      <div className="flex flex-wrap gap-1 mb-3 text-[10px] font-bold">
                        <span className={`px-1.5 py-0.5 rounded border ${vp.status === '存活' ? 'border-emerald-500/60 text-emerald-300' : 'border-slate-600 text-slate-400'}`}>{vp.status}</span>
                        {vp.protected && vp.status === '存活' && <span className="px-1.5 py-0.5 rounded border border-cyan-400 text-cyan-300"><i className="fa-solid fa-shield-halved mr-1"></i>守護中</span>}
                        {isTarget && <span className="px-1.5 py-0.5 rounded border border-purple-400 text-purple-300"><i className="fa-solid fa-wand-magic-sparkles mr-1"></i>女巫復活（與 {ownerName} 共同勝利）</span>}
                        {isOwner && <span className="px-1.5 py-0.5 rounded border border-pink-400 text-pink-300"><i className="fa-solid fa-hat-wizard mr-1"></i>女巫持有者（綁定 {targetName}）</span>}
                      </div>
                      <div className="space-y-2 max-h-[50vh] overflow-y-auto pr-1 scrollbar-none">
                        {cards.length > 0 ? cards.map((c, i) => (
                          <div key={(c.id || c.title) + '-' + i} className="bg-slate-800/60 border border-slate-700 rounded-lg p-2 flex items-start space-x-2">
                            <span className="bg-amber-500 text-slate-950 text-sm font-black w-7 h-7 rounded-full flex items-center justify-center shrink-0 font-mono">{c.value}</span>
                            <div className="min-w-0">
                              <div className="text-xs font-bold text-amber-300">{c.title}{c.revealedBy === 'BOUNTY' && <span className="text-[10px] text-rose-300 ml-1">賞金獵人公開</span>}{isCardActive(vp, c) && <span className="text-[10px] text-emerald-300 ml-1 bg-emerald-950/80 border border-emerald-500/50 px-1 rounded font-bold">生效中</span>}</div>
                              <div className="text-[10px] text-slate-300 leading-snug">{c.desc}</div>
                            </div>
                          </div>
                        )) : (
                          <div className="text-center text-slate-500 text-xs py-4">面前沒有牌</div>
                        )}
                      </div>
                      <button onClick={() => setViewPlayerId(null)} className="w-full mt-4 bg-slate-800 hover:bg-slate-700 text-cyan-300 text-xs py-2 rounded-xl border border-slate-700 transition">關閉</button>
                    </div>
                  </div>
                );
              })()}

              {/* 彈窗 3：暗牌區檢視／拿一還一選牌 */}
              {isCenterCardsModalOpen && (() => {
                const nameOf = (id) => id === humanPlayerId ? '你' : ((players.find(p => p.id === id) || {}).name || '?');
                return (
                  <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-slate-900 border border-amber-500/50 rounded-2xl w-full max-w-xs p-4 shadow-2xl relative">
                      <div className="flex justify-between items-center border-b border-slate-800 pb-2 mb-3">
                        <div className="flex items-center space-x-2">
                          <i className="fa-solid fa-moon text-amber-400"></i>
                          <h3 className="text-sm font-bold text-amber-300">{centerPickMode ? '拿一還一：選擇要拿的暗牌' : '桌面暗牌區'}</h3>
                        </div>
                        <button onClick={closeCenterModal} className="text-slate-400 hover:text-white text-base">
                          <i className="fa-solid fa-xmark"></i>
                        </button>
                      </div>

                      <div className="text-[10px] text-amber-200 bg-amber-500/10 border border-amber-500/30 rounded-lg px-2 py-1.5 mb-3 leading-snug">
                        <i className="fa-solid fa-circle-info mr-1"></i>
                        {centerPickMode
                          ? '拿一還一：選 1 格暗牌拿走，再放回 1 張手牌到同一格；放回後直接結束回合。'
                          : '拿一還一：選 1 格暗牌拿走，再放回 1 張手牌到同一格；放回後直接結束回合。'}
                      </div>

                      <div className="grid grid-cols-3 gap-2 py-1">
                        {centerMeta.map((m, i) => {
                          const card = centerCards[i];
                          const knowledge = centerKnowledge(m)[humanPlayerId];
                          const known = !!(knowledge && knowledge.card);
                          const stale = known && knowledge.stale;
                          const selectable = centerPickMode && !!card;
                          const selected = pickSlot === i;
                          return (
                            <div key={i} className="flex flex-col items-center">
                              <button
                                disabled={!selectable}
                                onClick={() => setPickSlot(i)}
                                className={`w-full h-24 flex flex-col items-center justify-center relative transition ${
                                  !card ? 'opacity-60' : ''
                                } ${selected ? 'drop-shadow-[0_0_10px_rgba(245,158,11,0.95)]' : ''} ${selectable ? 'cursor-pointer hover:brightness-125' : 'cursor-default'}`}
                              >
                                {!card ? (
                                  <span className="text-[9px] text-slate-400">已取走</span>
                                ) : known ? (
                                  <div className={`flex flex-col items-center ${stale ? 'opacity-50' : ''}`}>
                                    <span className="bg-cyan-500 text-slate-950 text-xs font-black w-5 h-5 rounded-full flex items-center justify-center font-mono">{knowledge.card.value}</span>
                                    <i className={`fa-solid ${knowledge.card.icon} text-lg text-cyan-300 my-0.5`}></i>
                                    <span className="text-[9px] font-black text-slate-100 leading-tight">{knowledge.card.title}</span>
                                    <span className="text-[8px] text-amber-300 mt-0.5">{stale ? '舊資訊' : '你看過'}</span>
                                  </div>
                                ) : (
                                  <FxBack cls="w-16 h-[88px]" moonCls="text-xl" label="未知" />
                                )}
                              </button>
                              <span className="text-[9px] text-amber-300 font-bold mt-1">暗牌 {i + 1}</span>
                              <div className="text-[8.5px] leading-tight text-center mt-0.5 space-y-0.5 w-full">
                                {m.swappedBy.length > 0
                                  ? <div className="text-rose-300 break-words"><i className="fa-solid fa-right-left mr-0.5"></i>{m.swappedBy.map(nameOf).join('、')}</div>
                                  : <div className="text-slate-500">未被換過</div>}
                              </div>
                            </div>
                          );
                        })}

                      <p className="text-[9px] text-slate-400 mt-2 leading-snug">
                        <i className="fa-solid fa-right-left text-rose-300 mr-0.5"></i>換過（拿一還一）。「舊資訊」＝你看過的暗牌，之後有人動過，內容未必還是原本那張。
                      </p>
                      {watchLog.length > 0 && (
                        <div className="mt-1.5 space-y-0.5">
                          {watchLog.map(w => (
                            <p key={w.id} className="text-[9px] text-sky-300 leading-snug"><i className="fa-solid fa-binoculars mr-0.5"></i>守夜人：{nameOf(w.pid)} 看過 3 張、換過 1 張（不知哪一格，順序已洗）</p>
                          ))}
                        </div>
                      )}
                      {visibleWatchNote && visibleWatchNote.text && (
                        <p className={`text-[9px] mt-1 leading-snug ${visibleWatchNote.stale ? 'text-slate-500' : 'text-cyan-300'}`}>
                          <i className="fa-solid fa-binoculars mr-0.5"></i>{visibleWatchNote.text}{visibleWatchNote.stale ? '（舊資訊）' : ''}
                        </p>
                      )}

                      {centerPickMode ? (
                        <div className="flex space-x-2 mt-3">
                          <button disabled={pickSlot === null} onClick={() => confirmTakeCenter(pickSlot)} className="flex-1 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white text-xs font-bold py-2 rounded-xl">
                            {pickSlot !== null ? `拿取暗牌 ${pickSlot + 1}` : '請先選一格暗牌'}
                          </button>
                          <button onClick={closeCenterModal} className="bg-slate-800 text-slate-300 text-xs px-3 py-2 rounded-xl border border-slate-700">取消</button>
                        </div>
                      ) : (
                        <>
                          <div className="h-3"></div>
                          <button onClick={closeCenterModal} className="w-full bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs py-2 rounded-xl border border-slate-700 transition">
                            關閉
                          </button>
                        </>
                      )}
                    </div>
                  </div>
                );
              })()}

            </div>
          );
        }

        // 互動對話框組件
        function WatchCard({ c, icon, selected, onClick }) {
          return (
            <button type="button" onClick={onClick} className={`relative rounded-lg border-2 px-1.5 pt-1.5 pb-1 bg-slate-800 flex flex-col items-center gap-0.5 transition ${selected ? 'border-amber-400 ring-2 ring-amber-400/70 -translate-y-0.5' : 'border-slate-600'}`}>
              <span className="absolute left-1.5 top-1 font-mono font-black text-amber-300 text-sm leading-none">{c.value}</span>
              <i className={`fa-solid ${icon || c.icon || 'fa-circle'} text-amber-400 text-lg mt-3`}></i>
              <span className="text-[10px] font-black text-amber-100 leading-tight">{c.title}</span>
              <span className="text-[8px] text-slate-400 leading-tight text-center">{c.desc}</span>
            </button>
          );
        }
        function PlayerPicker({ label, options, value, onChange, humanPlayerId }) {
          return (
            <div>
              <label className="block text-slate-400 mb-1">{label}</label>
              {options.length === 0 ? <div className="text-slate-500 py-1">無可選目標</div> : (
                <div className="grid grid-cols-3 gap-1.5">
                  {options.map(p => {
                    const sel = value === String(p.id);
                    return (
                      <button type="button" key={p.id} onClick={() => onChange(String(p.id))} className={`flex flex-col items-center rounded-lg border py-1.5 active:scale-95 ${sel ? 'border-emerald-400 bg-emerald-500/20 ring-2 ring-emerald-400/60' : 'border-slate-700 bg-slate-800'}`}>
                        <Avatar p={p} size="w-9 h-9" />
                        <span className={`text-[10px] font-bold mt-0.5 truncate max-w-full px-0.5 ${p.id === humanPlayerId ? 'text-sky-300' : 'text-slate-200'}`}>{p.name}</span>
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          );
        }

        function InteractionDialog({ modal, players, humanPlayerId, playerHands, centerCards, remainingCounts, allCards, onSubmit, onCancel }) {
          const preId = modal && modal.preselectTargetId != null ? String(modal.preselectTargetId) : '';
          const [selectedTarget, setSelectedTarget] = useState(preId);
          const [secondaryTarget, setSecondaryTarget] = useState('');
          const [guessedVal, setGuessedVal] = useState('');
          const [guessedVal2, setGuessedVal2] = useState('');
          const [selectedStolenCard, setSelectedStolenCard] = useState('');
          const [selectedKeepCard, setSelectedKeepCard] = useState('');

          const aliveTargets = players.filter(p => p.id !== humanPlayerId && p.status === '存活' && !p.protected);
          const deadTargets = players.filter(p => p.status === '出局');
          const preselectOnly = !!preId;
          const prePlayer = preId ? players.find(p => String(p.id) === preId) : null;
          const pickpocketPool = [players.find(p => p.id === humanPlayerId), ...aliveTargets].filter(Boolean).slice(0, 6);
          const togglePickpocket = (idStr) => {
            if (selectedTarget === idStr) {
              setSelectedTarget(secondaryTarget);
              setSecondaryTarget('');
              return;
            }
            if (secondaryTarget === idStr) {
              setSecondaryTarget('');
              return;
            }
            if (!selectedTarget) setSelectedTarget(idStr);
            else if (!secondaryTarget) setSecondaryTarget(idStr);
            else {
              // 已選滿兩個：以新點替換第二個
              setSecondaryTarget(idStr);
            }
          };
          // 刺客雙猜測：與扒手相同邏輯（第1下／第2下，再點取消）
          const toggleAssassinGuess = (vStr) => {
            if (guessedVal === vStr) {
              setGuessedVal(guessedVal2);
              setGuessedVal2('');
              return;
            }
            if (guessedVal2 === vStr) {
              setGuessedVal2('');
              return;
            }
            if (!guessedVal) setGuessedVal(vStr);
            else if (!guessedVal2) setGuessedVal2(vStr);
            else setGuessedVal2(vStr);
          };

          const isGuess = modal.type === 'VILLAGER' || modal.type === 'ASSASSIN';

          // 猜測用：各數值尚未現身的角色與張數（牌庫清單的剩餘數，再扣掉自己手上的牌）
          const unseenText = (v) => {
            const myTitles = (playerHands[humanPlayerId] || []).filter(Boolean).map(c => c.title);
            const parts = (allCards || []).filter(c => c.value === v).map(c => {
              const base = ((remainingCounts || {})[c.title] || { current: c.totalCount }).current;
              const n = Math.max(0, base - myTitles.filter(t => t === c.title).length);
              return n > 0 ? `${c.title}${n > 1 ? '×' + n : ''}` : null;
            }).filter(Boolean);
            return parts.length ? parts.join('、') : '已無';
          };

          // 掘墓人選定的玩家面前可奪取卡牌
          const gravediggerTarget = players.find(p => p.id.toString() === selectedTarget);
          const availableStolenCards = gravediggerTarget ? playedCardsOf(gravediggerTarget).filter(canSteal) : [];

          // 守夜人可選擇的卡牌組合 (手牌 + 中央暗牌)
          const watchmanHand = playerHands[humanPlayerId] || [];
          const watchmanOptions = [...centerCards, ...watchmanHand].filter(Boolean);

          return (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-emerald-500/50 rounded-2xl w-full max-w-xs p-4 shadow-2xl relative">
                <h3 className="text-sm font-bold text-emerald-300 border-b border-slate-800 pb-2 mb-3">
                  {modal.title || ('選擇【' + (modal.card ? modal.card.title : '能力') + '】目標')}
                </h3>

                {modal.type === 'INFO' ? (
                  <div>
                    {modal.infoTarget && (
                      <div className="flex flex-col items-center gap-2 mb-4">
                        <LocalPlayerContext.Provider value={humanPlayerId}><FxChip p={modal.infoTarget} size="w-11 h-11 text-xl" /></LocalPlayerContext.Provider>
                        {modal.infoCard ? (
                          <div className="w-[130px] h-[180px] bg-slate-900 border-2 border-cyan-500/80 rounded-xl p-2 flex flex-col justify-between shadow-[0_0_12px_rgba(6,182,212,0.3)]">
                            <span className="bg-cyan-500 text-slate-950 text-sm font-black w-6 h-6 rounded-full flex items-center justify-center font-mono">{modal.infoCard.value}</span>
                            <div className="w-full h-16 bg-slate-800/90 rounded-lg border border-slate-700/60 flex items-center justify-center my-1">
                              <i className={`fa-solid ${modal.infoCard.icon} text-3xl text-cyan-400`}></i>
                            </div>
                            <div className="text-center">
                              <div className="text-xs font-black text-slate-100 truncate tracking-wide">{modal.infoCard.title}</div>
                              <div className="text-[8.5px] text-slate-300 line-clamp-3 leading-tight mt-0.5">{modal.infoCard.desc}</div>
                            </div>
                          </div>
                        ) : <span className="text-xs text-slate-400">無手牌</span>}
                      </div>
                    )}
                    {modal.message && <p className="text-xs text-slate-300 mb-4 whitespace-pre-line">{modal.message}</p>}
                    <button onClick={onCancel} className="w-full bg-emerald-600 text-white text-xs py-2 rounded-xl font-bold">確定</button>
                  </div>
                ) : modal.type === 'DRUNK_VIEW' ? (
                  <div>
                    <p className="text-[11px] text-slate-300 mb-3">你拿走了所有玩家的手牌並秘密檢視（只有你看得到）。按下按鈕後，這些牌會面朝下洗勻，再隨機發給每位玩家 1 張。</p>
                    <div className="grid grid-cols-3 gap-2 mb-3">
                      {(modal.view || []).map(v => (
                        <div key={v.p.id} className="flex flex-col items-center gap-1 rounded-lg border border-slate-700/70 bg-slate-800/60 py-1.5">
                          <LocalPlayerContext.Provider value={humanPlayerId}><FxChip p={v.p} size="w-9 h-9 text-base" /></LocalPlayerContext.Provider>
                          {v.card ? <FxFace c={v.card} cls="w-12 h-[64px]" /> : <span className="text-[10px] text-slate-500 h-[64px] flex items-center">無手牌</span>}
                        </div>
                      ))}
                    </div>
                    {modal.skipped && modal.skipped.length > 0 && (
                      <div className="text-[10px] font-bold text-cyan-300 mb-3"><i className="fa-solid fa-shield-halved mr-1"></i>{modal.skipped.map(p => p.name).join('、')} 受保護未參與</div>
                    )}
                    <button onClick={() => onSubmit({ type: 'DRUNK_VIEW' })} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-2 rounded-xl font-bold"><i className="fa-solid fa-shuffle mr-1"></i>洗牌重發</button>
                  </div>
                ) : modal.type === 'SERVANT_CHOICE' ? (
                  <div>
                    <p className="text-xs text-slate-300 mb-4">回合結束，是否棄掉面前的【僕人】立刻進行額外回合？</p>
                    <div className="flex space-x-2">
                      <button onClick={() => onSubmit({ type: 'SERVANT_CHOICE', servantId: modal.servantId })} className="flex-1 bg-emerald-600 text-white text-xs py-2 rounded-xl font-bold">棄掉並額外回合</button>
                      <button onClick={onCancel} className="flex-1 bg-slate-800 text-slate-300 text-xs py-2 rounded-xl">不使用</button>
                    </div>
                  </div>
                ) : modal.type === 'COUNTER_SPY' ? (
                  <div>
                    <p className="text-xs text-slate-300 mb-4">其他人猜測您的手牌失敗！是否立刻打出【間諜】反殺該猜測者？</p>
                    <div className="flex space-x-2">
                      <button onClick={() => onSubmit({ type: 'COUNTER_SPY', attackerId: modal.sourceId })} className="flex-1 bg-emerald-600 text-white text-xs py-2 rounded-xl font-bold">反殺打出</button>
                      <button onClick={onCancel} className="flex-1 bg-slate-800 text-slate-300 text-xs py-2 rounded-xl">放棄</button>
                    </div>
                  </div>
                ) : modal.type === 'CONFIRM_NO_TARGET' ? (
                  <div>
                    {modal.card && (
                      <div className="flex items-center gap-2 mb-3 rounded-lg border border-amber-500/40 bg-slate-800/60 px-2 py-1.5">
                        <span className="bg-amber-500 text-slate-950 text-xs font-black w-6 h-6 rounded-full flex items-center justify-center font-mono">{modal.card.value}</span>
                        <span className="text-xs font-black text-amber-200">{modal.card.title}</span>
                      </div>
                    )}
                    <p className="text-xs text-slate-300 mb-4 whitespace-pre-line">{modal.message || '目前沒有可選擇的目標。確定打出？'}</p>
                    <div className="flex space-x-2">
                      <button onClick={() => onSubmit({ type: 'CONFIRM_NO_TARGET', card: modal.card })} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-2 rounded-xl font-bold">確定打出</button>
                      <button onClick={onCancel} className="flex-1 bg-slate-800 text-slate-300 text-xs py-2 rounded-xl">取消</button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3 text-xs">
                    {/* 守夜人卡牌選擇 */}
                    {modal.type === 'NIGHT_WATCHMAN' ? (
                      <div className="space-y-2">
                        <div className="text-slate-400">中央暗牌（3 張，完整翻開）：</div>
                        <div className="grid grid-cols-3 gap-2">
                          {centerCards.filter(Boolean).map(c => (
                            <WatchCard key={c.id} c={c} icon={(allCards.find(x => x.title === c.title) || {}).icon} selected={selectedKeepCard === c.id} onClick={() => setSelectedKeepCard(c.id)} />
                          ))}
                        </div>
                        <div className="text-slate-400">你現時的手牌：</div>
                        <div className="grid grid-cols-3 gap-2">
                          {watchmanHand.filter(Boolean).map(c => (
                            <WatchCard key={c.id} c={c} icon={(allCards.find(x => x.title === c.title) || {}).icon} selected={selectedKeepCard === c.id} onClick={() => setSelectedKeepCard(c.id)} />
                          ))}
                        </div>
                        <div className="text-[10px] text-slate-500">點選 1 張保留，其餘 3 張面朝下洗勻放回中央。</div>
                      </div>
                    ) : modal.type === 'GRAVEDIGGER' ? (
                      <div className="space-y-1.5">
                        <label className="block text-slate-400">點選欲奪取的牌（各玩家面前）：</label>
                        {players.filter(p => (p.id === humanPlayerId || !p.protected) && playedCardsOf(p).some(canSteal)).length === 0 && (
                          <div className="text-slate-500 py-1">場上無可奪取的牌</div>
                        )}
                        <div className="space-y-1.5 max-h-[45vh] overflow-y-auto pr-0.5 scrollbar-none">
                          {players.filter(p => (p.id === humanPlayerId || !p.protected) && playedCardsOf(p).some(canSteal)).map(p => (
                            <div key={p.id} className="flex items-start gap-2 rounded-lg border border-slate-700 bg-slate-800/60 p-1.5">
                              <div className="shrink-0 w-12"><LocalPlayerContext.Provider value={humanPlayerId}><FxChip p={p} size="w-9 h-9 text-base" /></LocalPlayerContext.Provider></div>
                              <div className="flex flex-wrap gap-1.5 min-w-0">
                                {playedCardsOf(p).filter(canSteal).map(c => {
                                  const sel = selectedStolenCard === c.id;
                                  return (
                                    <button type="button" key={c.id} onClick={() => { setSelectedTarget(String(p.id)); setSelectedStolenCard(c.id); }} className={`rounded-md border-2 px-1.5 py-1 flex items-center gap-1 bg-slate-900 active:scale-95 ${sel ? 'border-amber-400 ring-2 ring-amber-400/70' : 'border-slate-600'}`}>
                                      <span className="font-mono font-black text-amber-300 text-xs">{c.value}</span>
                                      <i className={`fa-solid ${c.icon || 'fa-circle'} text-amber-400 text-[10px]`}></i>
                                      <span className="text-[10px] font-black text-amber-100 whitespace-nowrap">{c.title}</span>
                                    </button>
                                  );
                                })}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    ) : modal.type === 'WITCH' ? (
                      preselectOnly && prePlayer ? (
                        <div className="flex items-center gap-2 rounded-lg border border-emerald-500/50 bg-emerald-950/30 px-2 py-1.5">
                          <LocalPlayerContext.Provider value={humanPlayerId}><FxChip p={prePlayer} size="w-9 h-9 text-base" /></LocalPlayerContext.Provider>
                          <div className="text-[11px] font-bold text-emerald-200">目標：{prePlayer.name}（唯一可選）</div>
                        </div>
                      ) : (
                        <PlayerPicker label="選擇復活玩家：" value={selectedTarget} onChange={setSelectedTarget} options={deadTargets} humanPlayerId={humanPlayerId} />
                      )
                    ) : modal.type === 'PICKPOCKET' ? (
                      <div>
                        <label className="block text-slate-400 mb-1">點選兩位目標（可含自己；再點同一人可取消）</label>
                        <div className="grid grid-cols-3 gap-1.5">
                          {pickpocketPool.map(p => {
                            const idStr = String(p.id);
                            const slot = selectedTarget === idStr ? 1 : secondaryTarget === idStr ? 2 : 0;
                            return (
                              <button
                                type="button"
                                key={p.id}
                                onClick={() => togglePickpocket(idStr)}
                                className={`relative flex flex-col items-center rounded-lg border py-1.5 active:scale-95 ${
                                  slot ? 'border-emerald-400 bg-emerald-500/20 ring-2 ring-emerald-400/60' : 'border-slate-700 bg-slate-800'
                                }`}
                              >
                                {slot > 0 && (
                                  <span className="absolute -top-1.5 -right-1.5 h-5 w-5 rounded-full bg-emerald-500 text-[10px] font-black text-slate-950 flex items-center justify-center shadow">{slot}</span>
                                )}
                                <Avatar p={p} size="w-9 h-9" />
                                <span className={`text-[10px] font-bold mt-0.5 truncate max-w-full px-0.5 ${p.id === humanPlayerId ? 'text-sky-300' : 'text-slate-200'}`}>{p.name}</span>
                              </button>
                            );
                          })}
                        </div>
                        <div className="mt-1.5 text-[10px] text-slate-500">
                          {selectedTarget && secondaryTarget
                            ? `已選：${players.find(p => String(p.id) === selectedTarget)?.name || '?'} ↔ ${players.find(p => String(p.id) === secondaryTarget)?.name || '?'}`
                            : selectedTarget
                              ? `已選第 1 位，請再選第 2 位`
                              : '請選擇兩位玩家互換手牌'}
                        </div>
                      </div>
                    ) : preselectOnly && prePlayer ? (
                      <div className="flex items-center gap-2 rounded-lg border border-emerald-500/50 bg-emerald-950/30 px-2 py-1.5">
                        <LocalPlayerContext.Provider value={humanPlayerId}><FxChip p={prePlayer} size="w-9 h-9 text-base" /></LocalPlayerContext.Provider>
                        <div className="text-[11px] font-bold text-emerald-200">目標：{prePlayer.name}（唯一可選）</div>
                      </div>
                    ) : (
                      <PlayerPicker label={modal.type === 'BOUNTY_HUNTER' ? '選擇目標（可選自己）：' : '選擇對手目標：'} value={selectedTarget} onChange={setSelectedTarget} options={modal.type === 'BOUNTY_HUNTER' ? [players.find(p => p.id === humanPlayerId), ...aliveTargets].filter(Boolean) : aliveTargets} humanPlayerId={humanPlayerId} />
                    )}

                    {/* 村民：單選數值；刺客：雙選數值（同扒手：第1／第2下，再點取消，角標1／2） */}
                    {modal.type === 'VILLAGER' && (
                      <div>
                        <label className="block text-slate-400 mb-1.5">宣告手牌數值 (0–10)：</label>
                        <div className="grid grid-cols-4 gap-1.5">
                          {[...Array(11).keys()].map(v => {
                            const sel = guessedVal === String(v);
                            return (
                              <button
                                type="button"
                                key={v}
                                onClick={() => setGuessedVal(String(v))}
                                className={`rounded-lg border px-1 py-1.5 text-center active:scale-95 transition ${sel ? 'border-amber-400 bg-amber-500/20 ring-2 ring-amber-400/50' : 'border-slate-700 bg-slate-800'}`}
                              >
                                <div className={`font-mono font-black text-sm ${sel ? 'text-amber-300' : 'text-slate-200'}`}>{v}</div>
                                <div className="text-[8px] leading-tight text-slate-400 mt-0.5 line-clamp-2">{unseenText(v)}</div>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    )}
                    {modal.type === 'ASSASSIN' && (
                      <div>
                        <label className="block text-slate-400 mb-1">點選兩個數值（再點同一數值可取消）</label>
                        <div className="grid grid-cols-4 gap-1.5">
                          {[...Array(11).keys()].map(v => {
                            const vStr = String(v);
                            const slot = guessedVal === vStr ? 1 : guessedVal2 === vStr ? 2 : 0;
                            return (
                              <button
                                type="button"
                                key={v}
                                onClick={() => toggleAssassinGuess(vStr)}
                                className={`relative rounded-lg border px-1 py-1.5 text-center active:scale-95 transition ${
                                  slot ? 'border-amber-400 bg-amber-500/20 ring-2 ring-amber-400/50' : 'border-slate-700 bg-slate-800'
                                }`}
                              >
                                {slot > 0 && (
                                  <span className="absolute -top-1.5 -right-1.5 h-5 w-5 rounded-full bg-amber-400 text-[10px] font-black text-slate-950 flex items-center justify-center shadow">{slot}</span>
                                )}
                                <div className={`font-mono font-black text-sm ${slot ? 'text-amber-300' : 'text-slate-200'}`}>{v}</div>
                                <div className="text-[8px] leading-tight text-slate-400 mt-0.5 line-clamp-2">{unseenText(v)}</div>
                              </button>
                            );
                          })}
                        </div>
                        <div className="mt-1.5 text-[10px] text-slate-500">
                          {guessedVal !== '' && guessedVal2 !== ''
                            ? `已選：(${guessedVal}) 與 (${guessedVal2})`
                            : guessedVal !== ''
                              ? `已選第 1 個（${guessedVal}），請再選第 2 個`
                              : '請選擇兩個猜測數值'}
                        </div>
                      </div>
                    )}

                    <div className="flex space-x-2 pt-2">
                      <button 
                        disabled={
                          modal.type === 'NIGHT_WATCHMAN' ? !selectedKeepCard :
                          modal.type === 'GRAVEDIGGER' ? (!selectedTarget || !selectedStolenCard) :
                          modal.type === 'PICKPOCKET' ? (!selectedTarget || !secondaryTarget) :
                          modal.type === 'ASSASSIN' ? (!selectedTarget || guessedVal === '' || guessedVal2 === '') :
                          modal.type === 'VILLAGER' ? (!selectedTarget || guessedVal === '') :
                          !selectedTarget
                        }
                        onClick={() => onSubmit({ 
                          type: modal.type, 
                          targetId: parseInt(selectedTarget), 
                          secondaryTargetId: parseInt(secondaryTarget), 
                          guessedValue: guessedVal,
                          guessedValue2: guessedVal2,
                          stolenCardId: selectedStolenCard,
                          keepCardId: selectedKeepCard
                        })} 
                        className="flex-1 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white font-bold py-2 rounded-xl"
                      >
                        確認發動
                      </button>
                      <button onClick={onCancel} className="bg-slate-800 text-slate-300 px-3 py-2 rounded-xl">取消</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        class RenderErrorBoundary extends React.Component {
          constructor(props) {
            super(props);
            this.state = { error: null };
          }
          static getDerivedStateFromError(error) {
            return { error };
          }
          componentDidCatch(error, info) {
            console.error('遊戲畫面渲染失敗：', error, info.componentStack);
          }
          render() {
            if (this.state.error) {
              return (
                <div role="alert" className="min-h-screen bg-slate-950 text-rose-200 flex flex-col items-center justify-center gap-3 p-6 text-center">
                  <h1 className="text-lg font-black">遊戲畫面發生錯誤</h1>
                  <p className="max-w-xl text-sm break-words">{String(this.state.error.message || this.state.error)}</p>
                  <p className="text-xs text-slate-400">請重新載入頁面；若問題重現，請提供此錯誤訊息與出問題的牌名。</p>
                  <button onClick={() => window.location.reload()} className="rounded-lg bg-rose-900/70 px-4 py-2 text-sm font-bold">重新載入</button>
                </div>
              );
            }
            return this.props.children;
          }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RenderErrorBoundary><App /></RenderErrorBoundary>);
    </script>
</body>
</html>
