                );
              })()}

              {/* 彈窗 3：暗牌區檢視 */}
              {isCenterCardsModalOpen && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className="bg-slate-900 border border-amber-500/50 rounded-2xl w-full max-w-xs p-4 shadow-2xl relative">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-2 mb-3">
                      <div className="flex items-center space-x-2">
                        <i className="fa-solid fa-dragon text-amber-400"></i>
                        <h3 className="text-sm font-bold text-amber-300">桌面暗牌區</h3>
                      </div>
                      <button onClick={() => setIsCenterCardsModalOpen(false)} className="text-slate-400 hover:text-white text-base">
                        <i className="fa-solid fa-xmark"></i>
                      </button>
                    </div>
                    
                    <div className="py-3 flex justify-center space-x-3">
                      {centerCards.length > 0 ? (
                        centerCards.filter(Boolean).map((card, i) => (
                          <div key={card.id || i} className="w-16 h-24 bg-slate-800 border-2 border-slate-600 rounded-lg shadow-lg flex flex-col items-center justify-center relative overflow-hidden transition-transform hover:scale-105">
                            <i className="fa-solid fa-dragon text-amber-500/80 text-xl mb-1 filter drop-shadow"></i>
                            <span className="text-[9px] text-amber-300 font-bold z-10">暗牌 {i+1}</span>
                          </div>
                        ))
                      ) : (
                        <div className="text-slate-500 text-xs py-4">桌面無暗牌</div>
                      )}
                    </div>
                    <p className="text-[10px] text-slate-400 text-center mb-3">使用「拿一還一」可取得第一張暗牌。</p>

                    <button onClick={() => setIsCenterCardsModalOpen(false)} className="w-full bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs py-2 rounded-xl border border-slate-700 transition">
                      關閉
                    </button>
                  </div>
                </div>
              )}

            </div>
          );
        }

        // 互動對話框組件
        function InteractionDialog({ modal, players, playerHands, centerCards, onSubmit, onCancel }) {
          const [selectedTarget, setSelectedTarget] = useState('');
          const [secondaryTarget, setSecondaryTarget] = useState('');
          const [guessedVal, setGuessedVal] = useState('0');
          const [guessedVal2, setGuessedVal2] = useState('1');
          const [selectedStolenCard, setSelectedStolenCard] = useState('');
          const [selectedKeepCard, setSelectedKeepCard] = useState('');

          const aliveTargets = players.filter(p => p.id !== 0 && p.status === '存活' && !p.protected);
          const deadTargets = players.filter(p => p.status === '出局');

          const isGuess = modal.type === 'VILLAGER' || modal.type === 'ASSASSIN';

          // 掘墓人選定的玩家面前可奪取卡牌
          const gravediggerTarget = players.find(p => p.id.toString() === selectedTarget);
          const availableStolenCards = gravediggerTarget ? gravediggerTarget.playedCards.filter(c => c && c.type !== 'WEREWOLF') : [];

          // 守夜人可選擇的卡牌組合 (手牌 + 中央暗牌)
          const watchmanHand = playerHands[0] || [];
          const watchmanOptions = [...centerCards, ...watchmanHand].filter(Boolean);

          return (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-emerald-500/50 rounded-2xl w-full max-w-xs p-4 shadow-2xl relative">
                <h3 className="text-sm font-bold text-emerald-300 border-b border-slate-800 pb-2 mb-3">
                  {modal.title || ('選擇【' + (modal.card ? modal.card.title : '能力') + '】目標')}
                </h3>

                {modal.type === 'INFO' ? (
                  <div>
                    <p className="text-xs text-slate-300 mb-4 whitespace-pre-line">{modal.message}</p>
                    <button onClick={onCancel} className="w-full bg-emerald-600 text-white text-xs py-2 rounded-xl font-bold">確定</button>
                  </div>
                ) : modal.type === 'SERVANT_CHOICE' ? (
                  <div>
                    <p className="text-xs text-slate-300 mb-4">回合結束，是否棄掉面前的【僕人】立刻進行額外回合？</p>
                    <div className="flex space-x-2">
                      <button onClick={() => onSubmit({ type: 'SERVANT_CHOICE', servantId: modal.servantId })} className="flex-1 bg-emerald-600 text-white text-xs py-2 rounded-xl font-bold">棄掉並額外回合</button>
                      <button onClick={onCancel} className="flex-1 bg-slate-800 text-slate-300 text-xs py-2 rounded-xl">不使用</button>
                    </div>
                  </div>
                ) : modal.type === 'COUNTER_SPY' ? (
                  <div>
                    <p className="text-xs text-slate-300 mb-4">其他人猜測您的手牌失敗！是否立刻打出【間諜】反殺該猜測者？</p>
                    <div className="flex space-x-2">
                      <button onClick={() => onSubmit({ type: 'COUNTER_SPY', attackerId: modal.sourceId })} className="flex-1 bg-emerald-600 text-white text-xs py-2 rounded-xl font-bold">反殺打出</button>
                      <button onClick={onCancel} className="flex-1 bg-slate-800 text-slate-300 text-xs py-2 rounded-xl">放棄</button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3 text-xs">
                    {/* 守夜人卡牌選擇 */}
                    {modal.type === 'NIGHT_WATCHMAN' ? (
                      <div>
                        <label className="block text-slate-400 mb-1">從手牌與中央暗牌中選擇 1 張保留：</label>
                        <select value={selectedKeepCard} onChange={e => setSelectedKeepCard(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-white">
                          <option value="">-- 請選擇保留卡牌 --</option>
                          {watchmanOptions.map(c => <option key={c.id} value={c.id}>({c.value}) {c.title}</option>)}
                        </select>
                      </div>
                    ) : modal.type === 'GRAVEDIGGER' ? (
                      <>
                        <div>
                          <label className="block text-slate-400 mb-1">選擇目標玩家：</label>
                          <select value={selectedTarget} onChange={e => { setSelectedTarget(e.target.value); setSelectedStolenCard(''); }} className="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-white">
                            <option value="">-- 請選擇玩家 --</option>
                            {players.filter(p => (p.id === 0 || !p.protected) && p.playedCards.some(c => c && c.type !== 'WEREWOLF')).map(p => (
                              <option key={p.id} value={p.id}>{p.name}</option>
                            ))}
                          </select>
                        </div>
                        {selectedTarget && (
                          <div>
                            <label className="block text-slate-400 mb-1">選擇欲奪取之卡牌：</label>
                            <select value={selectedStolenCard} onChange={e => setSelectedStolenCard(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-white">
                              <option value="">-- 請選擇卡牌 --</option>
                              {availableStolenCards.map(c => <option key={c.id} value={c.id}>({c.value}) {c.title}</option>)}
                            </select>
                          </div>
                        )}
                      </>
                    ) : modal.type === 'WITCH' ? (
                      <div>
                        <label className="block text-slate-400 mb-1">選擇復活玩家：</label>
                        <select value={selectedTarget} onChange={e => setSelectedTarget(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-white">
                          <option value="">-- 請選擇 --</option>
                          {deadTargets.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                        </select>
                      </div>
                    ) : modal.type === 'PICKPOCKET' ? (
                      <>
                        <div>
                          <label className="block text-slate-400 mb-1">選擇目標玩家 1：</label>
                          <select value={selectedTarget} onChange={e => setSelectedTarget(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-white">
                            <option value="">-- 請選擇 --</option>
                            {aliveTargets.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="block text-slate-400 mb-1">選擇目標玩家 2：</label>
                          <select value={secondaryTarget} onChange={e => setSecondaryTarget(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-white">
                            <option value="">-- 請選擇 --</option>
                            {aliveTargets.filter(p => p.id.toString() !== selectedTarget).map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                          </select>
                        </div>
                      </>
                    ) : (
                      <div>
                        <label className="block text-slate-400 mb-1">選擇對手目標：</label>
                        <select value={selectedTarget} onChange={e => setSelectedTarget(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-white">
                          <option value="">-- 請選擇 --</option>
                          {aliveTargets.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                        </select>
                      </div>
                    )}

                    {/* 猜測數值選擇 */}
                    {isGuess && (
                      <div>
                        <label className="block text-slate-400 mb-1">{modal.type === 'ASSASSIN' ? '第 1 次猜測數值 (0–10)：' : '宣告手牌數值 (0–10)：'}</label>
                        <select value={guessedVal} onChange={e => { const v = e.target.value; setGuessedVal(v); if (v === guessedVal2) setGuessedVal2(v === '0' ? '1' : '0'); }} className="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-amber-300 font-bold">
                          {[...Array(11).keys()].map(v => <option key={v} value={v}>數值 {v}</option>)}
                        </select>
                      </div>
                    )}
                    {modal.type === 'ASSASSIN' && (
                      <div>
                        <label className="block text-slate-400 mb-1">第 2 次猜測數值 (0–10，同一目標)：</label>
                        <select value={guessedVal2} onChange={e => setGuessedVal2(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-amber-300 font-bold">
                          {[...Array(11).keys()].filter(v => v.toString() !== guessedVal).map(v => <option key={v} value={v}>數值 {v}</option>)}
                        </select>
                      </div>
                    )}

                    <div className="flex space-x-2 pt-2">
                      <button 
                        disabled={
                          modal.type === 'NIGHT_WATCHMAN' ? !selectedKeepCard :
                          modal.type === 'GRAVEDIGGER' ? (!selectedTarget || !selectedStolenCard) :
                          modal.type === 'PICKPOCKET' ? (!selectedTarget || !secondaryTarget) :
                          !selectedTarget
                        }
                        onClick={() => onSubmit({ 
                          type: modal.type, 
                          targetId: parseInt(selectedTarget), 
                          secondaryTargetId: parseInt(secondaryTarget), 
                          guessedValue: guessedVal,
                          guessedValue2: guessedVal2,
                          stolenCardId: selectedStolenCard,
                          keepCardId: selectedKeepCard
                        })} 
                        className="flex-1 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white font-bold py-2 rounded-xl"
                      >
                        確認發動
                      </button>
                      <button onClick={onCancel} className="bg-slate-800 text-slate-300 px-3 py-2 rounded-xl">取消</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
