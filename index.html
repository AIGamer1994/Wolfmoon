          { v: 5, name: '叛徒', d: '第 3 張月亮翻開且狼人獲勝時，手握叛徒者一同獲勝。' },
          { v: 5, name: '賞金獵人', d: '指定玩家公開手牌並重抽；若以此打出市長或狼人則出局，打出吸血鬼且達成條件則獲勝。' },
          { v: 6, name: '掘墓人', d: '從一位玩家面前取 1 張牌（狼人除外）加入手牌，再選 1 張打出。' },
          { v: 6, name: '扒手', d: '指定兩位對手互換手牌。' },
          { v: 7, name: '間諜', d: '他人用刺客／村民猜你失敗時，可打出間諜使其出局並接手其手牌。' },
          { v: 7, name: '小偷', d: '與一位對手交換手牌，並立刻進行額外回合。' },
          { v: 8, name: '陰謀家', d: '手握時被對手牌效淘汰，該對手一同出局（僅剩兩人同時出局則無人獲勝）。' },
          { v: 8, name: '煉金術士', d: '被對手牌效淘汰時，可棄掉面前的煉金術士抽 1 張復活。' },
          { v: 9, name: '市長', d: '放在自己面前立刻出局。' },
          { v: 10, name: '狼人', d: '放在自己面前立刻出局；第 3 張月亮翻開時手握狼人者獲勝。' },
        ];

        // 每一格中央暗牌的追蹤資料：誰看過、誰換過、玩家自己看過的內容（myStale = 之後有人動過）
        const makeCenterMeta = () => ({ viewedBy: [], swappedBy: [], myCard: null, myStale: false });

        function App() {
          const [version] = useState('v0.0.11 M');

          // 全局遊戲狀態
          const [players, setPlayers] = useState(INITIAL_PLAYERS);
          const [currentTurnIndex, setCurrentTurnIndex] = useState(0);

          // 雙行動態廣播狀態 (Line 1: 動作簡報, Line 2: 最終結果)
          const [broadcastAction, setBroadcastActionRaw] = useState('狼月降臨！準備開啟遊戲');
          const [broadcastReveal, setBroadcastReveal] = useState('');   // 第 3 行：公開手牌
          const [broadcastEvent, setBroadcastEvent] = useState(null);   // { type: 'out' | 'revive', key }
          // 任何新的動作廣播都會清掉上一筆的「公開手牌」與亮燈
          const setBroadcastAction = (v) => { setBroadcastActionRaw(v); setBroadcastReveal(''); setBroadcastEvent(null); };
          const [broadcastResult, setBroadcastResult] = useState('輪到你的回合');

          const [moonPhase, setMoonPhase] = useState(0);
          const [gameOver, setGameOver] = useState(false);
          const [winnerInfo, setWinnerInfo] = useState(null);
          const [wins, setWins] = useState({}); // 勝場月亮標記（跨局累計）
          const [victoryDismissed, setVictoryDismissed] = useState(false); // 勝利視窗已關閉（返回牌桌查看全部牌）

          // 牌庫、備用牌、手牌、中央牌
          const [deck, setDeck] = useState([]);
          const [reserveCards, setReserveCards] = useState([]);
          const [playerHands, setPlayerHands] = useState({});
          const [centerCards, setCenterCards] = useState([]);
          const [playedCardArena, setPlayedCardArena] = useState(null);
          const [historyLogs, setHistoryLogs] = useState([]);
          const [witchTargetOwner, setWitchTargetOwner] = useState(null);

          const [selectedHandCard, setSelectedHandCard] = useState(null);

          // 彈窗與互動介面狀態
          const [isDeckModalOpen, setIsDeckModalOpen] = useState(false);
          const [isRulesModalOpen, setIsRulesModalOpen] = useState(false);
          const [isHistoryModalOpen, setIsHistoryModalOpen] = useState(false);
          const [isCenterCardsModalOpen, setIsCenterCardsModalOpen] = useState(false);
          const [centerMeta, setCenterMeta] = useState(() => [0, 1, 2].map(makeCenterMeta));
          const [centerKnownSet, setCenterKnownSet] = useState(null); // （保留，不再使用）
          const [watchLog, setWatchLog] = useState([]);   // 守夜人使用紀錄（公開：誰看過3張、換過1張）
          const [watchNote, setWatchNote] = useState(null); // 玩家本人用守夜人的私人備註 { text, stale }
          const [centerPickMode, setCenterPickMode] = useState(false);
          const [pickSlot, setPickSlot] = useState(null);

          // 互動能力彈窗
          const [interactionModal, setInteractionModal] = useState(null);
          const [isReturningCenterCard, setIsReturningCenterCard] = useState(false);
          const [extraTurnPlayerId, setExtraTurnPlayerId] = useState(null);
          const [turnTick, setTurnTick] = useState(0);
          const [actionLocked, setActionLocked] = useState(false);
          const lockRef = useRef(false);
          const [aiPaused, setAiPaused] = useState(false);
          const pausedRef = useRef(false);
          const pendingAiRef = useRef(false);
          const aiRunRef = useRef(0);
          const winsRef = useRef({});
          const takenCardRef = useRef(null);
          const takenSlotRef = useRef(null);
          const dragRef = useRef(null);   // 手牌拖曳中的資料
          const arenaRef = useRef(null);  // C 區（放開即出牌的區域）
          const [dragGhost, setDragGhost] = useState(null);
          const [viewPlayerId, setViewPlayerId] = useState(null);
          const gameOverRef = useRef(false);
          const resolveRef = useRef(null);
          const stateRef = useRef({});
          stateRef.current = { players, playerHands, deck, reserveCards, centerCards, moonPhase, extraTurnPlayerId, currentTurnIndex, witchTargetOwner };

          // 洗牌算法
          const shuffle = (array) => {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
          };

          // 統一更新廣播與紀錄
          const logActionAndResult = (actionText, resultText, playerName = '系統', event = null, reveal = '') => {
            setBroadcastAction(actionText);
            setBroadcastResult(`➔ ${resultText}`);
            if (reveal) setBroadcastReveal(reveal);
            if (event) setBroadcastEvent({ type: event, key: `${Date.now()}-${Math.random()}` });
            setHistoryLogs(prev => [
              { id: `${Date.now()}-${Math.random()}`, player: playerName, action: actionText, result: resultText, reveal, event, card: `${actionText} ➔ ${resultText}` },
              ...prev
            ]);
          };

          // 暗牌追蹤：某人對某一格「拿一還一」（看過 + 換過）
          const metaApplySwap = (slot, pid, placed) => {
            setCenterMeta(prev => prev.map((m, i) => i !== slot ? m : {
              viewedBy: m.viewedBy.includes(pid) ? m.viewedBy : [...m.viewedBy, pid],
              swappedBy: m.swappedBy.includes(pid) ? m.swappedBy : [...m.swappedBy, pid],
              myCard: pid === 0 ? placed : m.myCard,
              myStale: pid === 0 ? false : (m.myCard ? true : m.myStale),
            }));
            if (pid !== 0) { setCenterKnownSet(null); setWatchNote(prev => prev ? { ...prev, stale: true } : prev); }
          };

          // 暗牌追蹤：守夜人看過 3 張、換過 1 張並洗勻（公開只知「看過3、換過1、不知哪一格」）
          // 玩家本人用守夜人時，會知道洗勻後每一格是什麼牌（shuffled），並留下換出／換入的私人備註
          const metaWatchman = (pid, shuffled, note) => {
            setCenterMeta(prev => prev.map((m, i) => ({
              ...m,
              myCard: pid === 0 ? ((shuffled || [])[i] || null) : m.myCard,
              myStale: pid === 0 ? false : (m.myCard ? true : m.myStale),
            })));
            setWatchLog(prev => [...prev, { id: `${Date.now()}-${Math.random()}`, pid }]);
            setWatchNote(pid === 0 ? { text: note || '', stale: false } : (prev => prev ? { ...prev, stale: true } : prev));
            setCenterKnownSet(null);
          };

          // AI 的「拿一還一」：隨機拿一格暗牌；優先放回市長，其次放回數值較小的非狼人牌；之後結束回合
          const aiCenterSwap = (pid) => {
            const st = stateRef.current;
            const slots = st.centerCards.map((c, i) => c ? i : -1).filter(i => i >= 0);
            const handNow = (st.playerHands[pid] || []).filter(Boolean);
            if (slots.length === 0 || handNow.length !== 1) return false;
            const slot = slots[Math.floor(Math.random() * slots.length)];
            const taken = st.centerCards[slot];
            const two = [...handNow, taken];
            let ret = two.find(c => c.type === 'MAYOR');
            if (!ret) ret = two.filter(c => c.type !== 'WEREWOLF').sort((a, b) => a.value - b.value)[0];
            if (!ret) ret = two[0];
            const keep = two.find(c => c.id !== ret.id) || ret;
            const newCenter = [...st.centerCards];
            newCenter[slot] = ret;
            stateRef.current.centerCards = newCenter;
            setCenterCards(newCenter);
            setHandNow(pid, [keep]);
            metaApplySwap(slot, pid, ret);
            const name = st.players.find(p => p.id === pid).name;
            logActionAndResult(`${name} 執行【拿一還一】`, `替換了 1 張中央暗牌（暗牌 ${slot + 1}）➔ 中央暗牌維持 3 張`, name);
            advanceTurn();
            return true;
          };

          // 玩家（人類）換到新手牌時，列出取得的牌（僅限自己；AI 取得的牌不公開）
          const gotCardsText = (hand, oldHand) => {
            const fmt = (arr) => arr.map(c => `(${c.value})【${c.title}】`).join('、');
            const cs = (hand || []).filter(Boolean);
            const os = (oldHand || []).filter(Boolean);
            if (!cs.length) return os.length ? `｜你 換出 ${fmt(os)}` : '';
            return os.length ? `｜你 換出 ${fmt(os)}、取得 ${fmt(cs)}` : `｜你 取得 ${fmt(cs)}`;
          };

          // 按照規則初始化準備遊戲（三層牌庫結構）
          const initGame = () => {
            let base29 = [];
            let idCounter = 0;
            BASE_CARDS_DEF.forEach(c => {
              for (let i = 0; i < c.totalCount; i++) {
                base29.push({ ...c, id: `card-${idCounter++}-${Math.random().toString(36).substr(2, 4)}` });
              }
            });
            base29 = shuffle(base29);

            const hands = {};
            INITIAL_PLAYERS.forEach(p => {
              hands[p.id] = [base29.pop()];
            });

            const reserves = [base29.pop(), base29.pop()];
            const center = [base29.pop(), base29.pop(), base29.pop()];

            const chunkSize = Math.floor(base29.length / 3);
            let bottomTier = base29.slice(0, chunkSize);
            let middleTier = base29.slice(chunkSize, chunkSize * 2);
            let topTier = base29.slice(chunkSize * 2);

            const wolfMoon = { ...MOON_CARDS[2], id: `moon-3-${Math.random().toString(36).substr(2, 4)}` };
            const howlMoon = { ...MOON_CARDS[1], id: `moon-2-${Math.random().toString(36).substr(2, 4)}` };
            const loneMoon = { ...MOON_CARDS[0], id: `moon-1-${Math.random().toString(36).substr(2, 4)}` };

            bottomTier = shuffle([...bottomTier, wolfMoon]);
            const werewolfCard = { ...WEREWOLF_CARD, id: `werewolf-${Math.random().toString(36).substr(2, 4)}` };
            // 狼人角色牌改洗入上層（見下方）

            middleTier = shuffle([...middleTier, howlMoon]);
            // 牌庫以陣列尾端為頂（pop 抽牌），陣列最前面 = 該層最底。
            // 上層：6 張普通牌 + 狼人洗勻，孤狼月亮放在上層最底 ➔ 狼人必在第 1 張月亮之前出現
            topTier = [loneMoon, ...shuffle([...topTier, werewolfCard])];

            const finalDeck = [...bottomTier, ...middleTier, ...topTier];

            setDeck(finalDeck);
            setReserveCards(reserves);
            setCenterCards(center);
            setCenterMeta([0, 1, 2].map(makeCenterMeta));
            setCenterKnownSet(null);
            setWatchLog([]);
            setWatchNote(null);
            setVictoryDismissed(false);
            setCenterPickMode(false);
            setPickSlot(null);
            takenCardRef.current = null;
            takenSlotRef.current = null;
            setPlayerHands(hands);
            setPlayers(INITIAL_PLAYERS.map(p => ({ ...p, status: '存活', protected: false, playedCards: [], witchRevived: false })));
            setCurrentTurnIndex(0);
            setMoonPhase(0);
            setGameOver(false);
            setWinnerInfo(null);
            gameOverRef.current = false;
            lockRef.current = false;
            setActionLocked(false);
            setPlayedCardArena(null);
            setWitchTargetOwner(null);
            setIsReturningCenterCard(false);
            setExtraTurnPlayerId(null);
            
            setBroadcastAction('《狼月》牌庫準備完畢！');
            setBroadcastResult('➔ 狼人已潛伏在牌庫頂層');
            setHistoryLogs([{ id: Date.now(), player: '系統', card: '《狼月》牌庫準備完畢！狼人已潛伏在頂層。' }]);
          };

          useEffect(() => {
            initGame();
          }, []);

          // 全部角色牌參考清單
          const ALL_CARDS = useMemo(() => [...BASE_CARDS_DEF, WEREWOLF_CARD], []);

          // 各卡牌剩餘統計
          const remainingCounts = useMemo(() => {
            const counts = {};
            ALL_CARDS.forEach(c => counts[c.title] = { current: c.totalCount, total: c.totalCount });
            
            let activeCards = [...deck, ...reserveCards, ...centerCards];
            Object.values(playerHands).forEach(h => { if(Array.isArray(h)) activeCards.push(...h); });

            ALL_CARDS.forEach(c => {
              const inGameCount = activeCards.filter(card => card && card.title === c.title).length;
              counts[c.title].current = inGameCount;
            });

            return counts;
          }, [deck, reserveCards, centerCards, playerHands, ALL_CARDS]);

          const getNextAliveIndex = (fromIndex, pList = players) => {
            let nextIdx = (fromIndex + 1) % pList.length;
            let attempts = 0;
            while (pList[nextIdx].status === '出局' && attempts < pList.length) {
              nextIdx = (nextIdx + 1) % pList.length;
              attempts++;
            }
            return nextIdx;
          };

          const setHandNow = (id, hand) => {
            stateRef.current.playerHands = { ...stateRef.current.playerHands, [id]: hand };
            setPlayerHands(prev => ({ ...prev, [id]: hand }));
          };

          const eliminatePlayer = (targetId, killerId = null, reason = '牌效出局', keepHand = false) => {
            const st = stateRef.current;
            const target = st.players.find(p => p.id === targetId);
            if (!target || target.status === '出局') return;
            const targetHand = (st.playerHands[targetId] || []).filter(Boolean);

            if (killerId !== null && killerId !== targetId) {
              const hasAlchemist = target.playedCards.some(c => c && c.title === '煉金術士');
              if (hasAlchemist) {
                const drawn = drawCardForPlayer(targetId, false) || st.reserveCards[0];
                setPlayers(prev => prev.map(p => p.id === targetId ? { ...p, playedCards: [...p.playedCards.filter(c => c && c.title !== '煉金術士'), ...(keepHand ? [] : targetHand)] } : p));
                setHandNow(targetId, drawn ? [drawn] : []);
                logActionAndResult(`${target.name} 遭遇淘汰`, `棄掉面前【煉金術士】抽牌復活！`, target.name, 'revive');
                return;
              }
            }

            setPlayers(prev => prev.map(p => p.id === targetId ? { ...p, status: '出局', protected: false, playedCards: keepHand ? p.playedCards : [...p.playedCards, ...targetHand.filter(c => !p.playedCards.some(x => x && x.id === c.id))] } : p));
            if (!keepHand) setHandNow(targetId, []);
            // 不另開一筆紀錄：把「公開手牌」放在剛才那筆牌效結果的下一行（另一種顏色），並亮紅燈
            const handText = targetHand.length ? targetHand.map(c => `(${c.value})【${c.title}】`).join('、') : '無';
            const revealText = `${target.name} 公開手牌：${handText}`;
            setBroadcastReveal(prev => prev ? `${prev}｜${revealText}` : revealText);
            setBroadcastEvent({ type: 'out', key: `${Date.now()}-${Math.random()}` });
            setHistoryLogs(prev => prev.length ? [{ ...prev[0], reveal: prev[0].reveal ? `${prev[0].reveal}｜${revealText}` : revealText, event: 'out' }, ...prev.slice(1)] : prev);

            if (killerId !== null && killerId !== targetId && targetHand.some(c => c.title === '陰謀家')) {
              const killer = st.players.find(p => p.id === killerId);
              if (killer) {
                logActionAndResult(`${target.name} 手握【陰謀家】`, `觸發同歸於盡！${killer.name} 也同時出局`, target.name);
                eliminatePlayer(killerId, null, '陰謀家同歸於盡');
              }
            }

            setTimeout(() => { checkWinConditions(); }, 500);
          };

          const checkWinConditions = (isDeckEmpty = false) => {
            if (gameOverRef.current) return true;
            const st = stateRef.current;
            const alivePlayers = st.players.filter(p => p.status === '存活');
            if (alivePlayers.length === 1) {
              triggerVictory(alivePlayers[0], '存活勝利：成為場上唯一倖存的玩家！');
              return true;
            }
            if (alivePlayers.length === 0) {
              triggerVictory(null, '同歸於盡：無人獲勝！');
              return true;
            }
            if (isDeckEmpty || st.deck.length === 0) {
              resolveDeckEmptyVictory(alivePlayers);
              return true;
            }
            return false;
          };

          const resolveDeckEmptyVictory = (alivePlayers) => {
            if (gameOverRef.current) return;
            const hands = stateRef.current.playerHands;
            const fmtCard = (c) => c ? `(${c.value})【${c.title}】` : '';
            for (let p of alivePlayers) {
              const hand = hands[p.id] || [];
              if (hand.some(c => c && c.title === '乞丐之王')) {
                const has8or9 = alivePlayers.some(other => (hands[other.id] || []).some(c => c && (c.value === 8 || c.value === 9)));
                if (has8or9) {
                  const handRows = alivePlayers.map(q => {
                    const c = (hands[q.id] || [])[0];
                    return { id: q.id, name: q.name, text: `${q.name} 手牌${c ? fmtCard(c) : '無'}`, sortVal: c ? c.value : -1 };
                  }).sort((a, b) => b.sortVal - a.sortVal);
                  triggerVictory(p, '乞丐之王勝利：發動絕密乞丐之王，獨享勝利！', true, { title: '乞丐之王結算：存活玩家手牌', rows: handRows });
                  return;
                }
              }
            }

            let maxScore = -99;
            let winners = [];
            const rows = [];
            alivePlayers.forEach(p => {
              const hand = hands[p.id] || [];
              const card = hand[0];
              let finalVal = card ? card.value : 0;
              let detail = card ? `手牌${fmtCard(card)}` : '無手牌';
              if (p.playedCards.some(c => c && c.title === '商人')) { finalVal += 2; detail += '＋商人 +2'; }
              if (card && card.title === '科學怪人' && p.playedCards.length > 0) {
                const vals = p.playedCards.filter(Boolean).map(c => c.value);
                if (vals.length > 0) {
                  const mn = Math.min(...vals), mx = Math.max(...vals);
                  finalVal = mn + mx;
                  detail = `手牌${fmtCard(card)}面前最小(${mn})＋最大(${mx})`;
                }
              }
              rows.push({ id: p.id, name: p.name, text: `${p.name} ${detail} ＝ (${finalVal})`, final: finalVal });
              if (finalVal > maxScore) { maxScore = finalVal; winners = [p]; }
              else if (finalVal === maxScore) winners.push(p);
            });
            rows.sort((a, b) => b.final - a.final);
            const scores = { title: '最終點數結算（牌庫耗盡）', rows };

            if (winners.length === 1) triggerVictory(winners[0], `數值勝利：手牌結算最高分 (${maxScore}分)！`, false, scores);
            else triggerVictory(winners, `數值平手：共同分享勝利 (${maxScore}分)！`, false, scores);
          };

          const triggerVictory = (winner, reason, noWitch = false, scores = null) => {
            if (gameOverRef.current) return;
            gameOverRef.current = true;
            const st = stateRef.current;
            const list = Array.isArray(winner) ? [...winner] : (winner ? [winner] : []);
            let winnerText = list.map(w => w.name).join(' & ') || '無人';
            const winnerIds = list.map(x => x.id);
            const w = st.witchTargetOwner;
            if (!noWitch && w && list.some(x => x.id === w.targetId) && !list.some(x => x.id === w.witchOwnerId)) {
              const witchOwner = st.players.find(p => p.id === w.witchOwnerId);
              if (witchOwner) { winnerText += ` & ${witchOwner.name} (女巫共同獲勝)`; winnerIds.push(witchOwner.id); }
            }
            setGameOver(true);
            // 勝場：每位獲勝者（含共同獲勝）得 1 個月亮標記；累計 2 勝贏得整場
            const nextWins = { ...winsRef.current };
            [...new Set(winnerIds)].forEach(id => { nextWins[id] = (nextWins[id] || 0) + 1; });
            winsRef.current = nextWins;
            setWins(nextWins);
            const matchWinners = [...new Set(winnerIds)].filter(id => nextWins[id] >= 2).map(id => (st.players.find(p => p.id === id) || {}).name);
            const scoreRows = scores && scores.rows ? scores.rows.map(r => ({ ...r, win: winnerIds.includes(r.id) })) : null;
            setWinnerInfo({ winnerName: winnerText, reason, matchWinners, winnerIds: [...new Set(winnerIds)], scores: scoreRows ? { title: scores.title, rows: scoreRows } : null });
            setBroadcastAction(`遊戲結束！【${winnerText}】獲勝`);
            setBroadcastResult(`➔ ${reason}`);
            setHistoryLogs(prev => [{ id: `${Date.now()}-${Math.random()}`, player: '系統', action: `遊戲結束！【${winnerText}】獲勝`, result: reason, reveal: '', event: null, card: `遊戲結束！【${winnerText}】獲勝 ➔ ${reason}` }, ...prev]);
            if (scoreRows && scoreRows.length) {
              setHistoryLogs(prev => [{ id: `${Date.now()}-${Math.random()}`, player: '系統', action: scores.title, result: scoreRows.map(r => `${r.win ? '🏆 ' : ''}${r.text}`).join('\n'), reveal: '', event: null, card: scores.title }, ...prev]);
            }
          };

          const moonArenaCard = (moon, name, phase) => ({ ...moon, value: '🌙', category: `月亮 ${phase}/3`, icon: 'fa-moon', playedBy: name, isMoon: true });

          // 第 3 張月亮翻開：手握狼人者獲勝（叛徒連帶）。回傳是否已結束遊戲
          const checkWerewolfMoonWin = () => {
            const st = stateRef.current;
            let werewolfWinner = null;
            let traitorWinner = null;
            st.players.filter(p => p.status === '存活').forEach(p => {
              const hand = (st.playerHands[p.id] || []).filter(Boolean);
              if (hand.some(c => c.title === '狼人')) werewolfWinner = p;
              if (hand.some(c => c.title === '叛徒')) traitorWinner = p;
            });
            if (!werewolfWinner) return false;
            const winners = [werewolfWinner];
            let reasonText = '狼月降臨勝利：第3張月亮翻開，手握狼人者掌控夜晚！';
            if (traitorWinner && traitorWinner.id !== werewolfWinner.id) {
              winners.push(traitorWinner);
              reasonText += `叛徒【${traitorWinner.name}】共同獲勝！`;
            }
            triggerVictory(winners, reasonText);
            return true;
          };

          // 回合抽牌：只抽 1 張。若是月亮牌 ➔ 先「打出」展示並計數，由玩家再選擇抽一打一／拿一還一（不給額外回合）
          const drawTurnCard = (playerId) => {
            const st = stateRef.current;
            const drawer = st.players.find(p => p.id === playerId);
            const tempDeck = [...st.deck];
            if (tempDeck.length === 0) return { card: null };
            const drawn = tempDeck.pop();
            stateRef.current.deck = tempDeck;
            setDeck(tempDeck);
            if (!drawn.isMoon) return { card: drawn };
            const phase = st.moonPhase + 1;
            stateRef.current.moonPhase = phase;
            setMoonPhase(phase);
            setPlayedCardArena(moonArenaCard(drawn, drawer.name, phase));
            logActionAndResult(`${drawer.name} 翻開【${drawn.title}】`, `月亮 ${phase}/3 ➔ 繼續抽牌`, drawer.name);
            if (phase >= 3 && checkWerewolfMoonWin()) return { card: null, moon: drawn, gameEnded: true };
            return { card: null, moon: drawn };
          };

          const drawCardForPlayer = (playerId, grantExtra = true) => {
            const st = stateRef.current;
            const drawer = st.players.find(p => p.id === playerId);
            let tempDeck = [...st.deck];
            let phase = st.moonPhase;
            let finalDrawnCard = null;

            while (tempDeck.length > 0) {
              const drawn = tempDeck.pop();
              if (drawn.isMoon) {
                phase += 1;
                setMoonPhase(phase);
                stateRef.current.moonPhase = phase;
                setPlayedCardArena(moonArenaCard(drawn, drawer.name, phase));
                logActionAndResult(`${drawer.name} 翻開【${drawn.title}】`, `月亮牌 ${phase}/3`, drawer.name);

                if (phase >= 3) {
                  let werewolfWinner = null;
                  let traitorWinner = null;
                  st.players.filter(p => p.status === '存活').forEach(p => {
                    const hand = (st.playerHands[p.id] || []).filter(Boolean);
                    if (hand.some(c => c.title === '狼人')) werewolfWinner = p;
                    if (hand.some(c => c.title === '叛徒')) traitorWinner = p;
                  });
                  if (werewolfWinner) {
                    const winners = [werewolfWinner];
                    let reasonText = '狼月降臨勝利：第3張月亮翻開，手握狼人者掌控夜晚！';
                    if (traitorWinner && traitorWinner.id !== werewolfWinner.id) {
                      winners.push(traitorWinner);
                      reasonText += `叛徒【${traitorWinner.name}】共同獲勝！`;
                    }
                    stateRef.current.deck = tempDeck;
                    setDeck(tempDeck);
                    triggerVictory(winners, reasonText);
                    return null;
                  }
                }
              } else {
                finalDrawnCard = drawn;
                break;
              }
            }
            stateRef.current.deck = tempDeck;
            setDeck(tempDeck);
            if (finalDrawnCard && playerId === 0) {
              // 牌效造成的抽牌（女巫復活、賞金獵人重抽、煉金術士復活）：僅記錄自己抽到的牌
              const msg = `你 抽到(${finalDrawnCard.value})【${finalDrawnCard.title}】`;
              setHistoryLogs(prev => [{ id: `${Date.now()}-${Math.random()}`, player: '你', card: msg }, ...prev]);
            }
            return finalDrawnCard;
          };

          const handleActionA = () => {
            if (lockRef.current) return;
            if (gameOver || players[currentTurnIndex].isAI) return;
            const currentHand = playerHands[0] || [];
            if (currentHand.length >= 2 || deck.length === 0) return;

            const result = drawTurnCard(0);
            if (result.card) {
              setPlayerHands(prev => ({ ...prev, 0: [...currentHand, result.card] }));
              logActionAndResult('你 執行【抽一打一】', `抽到(${result.card.value})【${result.card.title}】`, '你');
            } else if (result.moon) {
              // 月亮牌已打出：仍只有 1 張手牌，可再選「抽一打一」或「拿一還一」
              if (!gameOverRef.current) setBroadcastResult(`➔ 月亮 ${stateRef.current.moonPhase}/3，請繼續【抽一打一】或【拿一還一】`);
            } else if (!gameOverRef.current) {
              advanceTurn();
            }
          };

          const closeCenterModal = () => {
            setIsCenterCardsModalOpen(false);
            setCenterPickMode(false);
            setPickSlot(null);
          };

          // 拿一還一：先開啟暗牌視窗，由玩家自選要拿哪一格
          const handleActionB = () => {
            if (lockRef.current) return;
            if (gameOver || players[currentTurnIndex].isAI) return;
            const currentHand = playerHands[0] || [];
            if (currentHand.length >= 2 || centerCards.filter(Boolean).length === 0) return;
            setPickSlot(null);
            setCenterPickMode(true);
            setIsCenterCardsModalOpen(true);
          };

          const confirmTakeCenter = (slot) => {
            if (lockRef.current || gameOver || players[currentTurnIndex].isAI) return;
            const currentHand = playerHands[0] || [];
            const taken = centerCards[slot];
            if (currentHand.length >= 2 || !taken) return;

            const newCenter = [...centerCards];
            newCenter[slot] = null; // 該格暫時空出，放回的牌會回到同一格
            setCenterCards(newCenter);
            setPlayerHands(prev => ({ ...prev, 0: [...currentHand, taken] }));
            setIsReturningCenterCard(true);
            setSelectedHandCard(null);
            takenCardRef.current = taken;
            takenSlotRef.current = slot;

            // 玩家看過這格暗牌
            setCenterMeta(prev => prev.map((m, i) => i === slot ? { ...m, viewedBy: m.viewedBy.includes(0) ? m.viewedBy : [...m.viewedBy, 0], myCard: taken, myStale: false } : m));
            setCenterKnownSet(prev => prev ? prev.filter(c => c.id !== taken.id) : prev);
            closeCenterModal();

            setBroadcastAction('你 執行【拿一還一】');
            setBroadcastResult(`➔ 從暗牌 ${slot + 1} 拿到(${taken.value})【${taken.title}】，請拖曳 1 張手牌到戰場，放回同一格`);
          };

          const handleCardClick = (card) => {
            if (gameOver || players[currentTurnIndex].isAI) return;
            const myHand = playerHands[0] || [];
            if (myHand.length < 2) return;

            setSelectedHandCard(selectedHandCard?.id === card.id ? null : card);
          };

          // ---- 拖曳出牌：把手牌向上拖到中央戰場（C 區）後放開即出牌；放在戰場外放開則取消
          const canDragPlay = () => (
            !gameOver && !players[currentTurnIndex].isAI && !actionLocked && !lockRef.current && !interactionModal &&
            (playerHands[0] || []).filter(Boolean).length >= 2
          );
          const isOverArena = (x, y) => {
            const el = arenaRef.current;
            if (!el) return false;
            const r = el.getBoundingClientRect();
            return x >= r.left - 8 && x <= r.right + 8 && y >= r.top - 8 && y <= r.bottom + 8;
          };
          const handleHandPointerDown = (e, card) => {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            dragRef.current = { cardId: card.id, startX: e.clientX, startY: e.clientY, moved: false, pointerId: e.pointerId };
            try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
          };
          const handleHandPointerMove = (e) => {
            const d = dragRef.current;
            if (!d || d.pointerId !== e.pointerId) return;
            if (!d.moved) {
              if (Math.hypot(e.clientX - d.startX, e.clientY - d.startY) < 10) return;
              if (!canDragPlay()) return;
              d.moved = true;
            }
            const card = (playerHands[0] || []).find(c => c && c.id === d.cardId);
            if (!card) return;
            setDragGhost({ card, x: e.clientX, y: e.clientY, over: isOverArena(e.clientX, e.clientY) });
          };
          const handleHandPointerUp = (e) => {
            const d = dragRef.current;
            dragRef.current = null;
            try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
            if (!d || !d.moved) return;
            const card = (playerHands[0] || []).find(c => c && c.id === d.cardId);
            const over = isOverArena(e.clientX, e.clientY);
            setDragGhost(null);
            if (card && over && canDragPlay()) handleConfirmPlay(card);
          };
          const handleHandPointerCancel = () => {
            dragRef.current = null;
            setDragGhost(null);
          };

          const handleConfirmPlay = (cardArg) => {
            const chosen = (cardArg && cardArg.id) ? cardArg : selectedHandCard;
            if (!chosen || players[currentTurnIndex].isAI) return;
            if (lockRef.current) return;
            lockRef.current = true;
            setActionLocked(true);
            
            if (isReturningCenterCard) {
              const cardToReturn = chosen;
              const remainingHand = (playerHands[0] || []).filter(c => c.id !== cardToReturn.id);
              const slotRef = takenSlotRef.current;
              const idx = (slotRef !== null && slotRef !== undefined) ? slotRef : Math.max(0, centerCards.findIndex(c => !c));

              setPlayerHands(prev => ({ ...prev, 0: remainingHand }));
              setCenterCards(prev => { const n = [...prev]; n[idx] = cardToReturn; return n; });
              metaApplySwap(idx, 0, cardToReturn);
              setSelectedHandCard(null);
              setIsReturningCenterCard(false);

              const taken = takenCardRef.current;
              logActionAndResult('你 執行【拿一還一】', `${taken ? `從暗牌 ${idx + 1} 拿到(${taken.value})【${taken.title}】，` : ''}放回(${cardToReturn.value})【${cardToReturn.title}】 ➔ 中央暗牌維持 3 張`, '你');
              takenCardRef.current = null;
              takenSlotRef.current = null;
              advanceTurn();
              return;
            }

            const cardToPlay = chosen;
            setSelectedHandCard(null);
            executePlayPhase(0, cardToPlay);
          };

          const executePlayPhase = (playerId, card) => {
            const player = stateRef.current.players.find(p => p.id === playerId);
            setPlayerHands(prev => ({ ...prev, [playerId]: (prev[playerId] || []).filter(c => c && c.id !== card?.id) }));
            setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, protected: card?.type === 'BODYGUARD', playedCards: [...p.playedCards, card] } : p));
            setPlayedCardArena({ ...card, playedBy: player.name });
            // 延後結算，確保讀到已更新的手牌與面前牌
            setTimeout(() => { if (!gameOverRef.current && resolveRef.current) resolveRef.current(playerId, card); }, 500);
          };

          const resolveCardEffect = (sourceId, card) => {
            const source = players.find(p => p.id === sourceId);
            if (!card || !card.type) return;

            switch (card.type) {
              case 'MAYOR':
              case 'WEREWOLF':
                logActionAndResult(`${source.name} 打出了(${card.value})【${card.title}】`, '自我淘汰！', source.name);
                eliminatePlayer(sourceId, sourceId, `打出【${card.title}】自我淘汰`);
                advanceTurn();
                break;

              case 'VAMPIRE':
                const highCards = (source.playedCards || []).filter(c => c && c.value >= 7);
                if (highCards.length >= 2) {
                  triggerVictory(source, '吸血鬼降臨：面前集滿兩張 7 以上卡牌，立刻勝利！');
                } else {
                  logActionAndResult(`${source.name} 打出了(${card.value})【吸血鬼】`, '面前高階牌不足 2 張 ➔ 無法勝利', source.name);
                  advanceTurn();
                }
                break;

              case 'BODYGUARD':
                logActionAndResult(`${source.name} 打出了(4)【保鏢】獲得保護`, '免役牌效直至下個回合', source.name);
                advanceTurn();
                break;

              case 'SERVANT':
                logActionAndResult(`${source.name} 打出了(1)【僕人】`, '置於面前 ➔ 回合結束時可棄掉換額外回合', source.name);
                advanceTurn();
                break;

              case 'DRUNKARD': {
                const stNow = stateRef.current;
                const participants = stNow.players.filter(p => p.status === '存活' && (p.id === sourceId || !p.protected));
                const skipped = stNow.players.filter(p => p.status === '存活' && p.id !== sourceId && p.protected);
                let pool = [];
                participants.forEach(p => { pool.push(...(stNow.playerHands[p.id] || []).filter(Boolean)); });
                pool = shuffle(pool);
                const dealt = {};
                participants.forEach(p => { dealt[p.id] = pool.length ? [pool.pop()] : []; });
                stateRef.current.playerHands = { ...stNow.playerHands, ...dealt };
                setPlayerHands(prev => ({ ...prev, ...dealt }));
                logActionAndResult(
                  `${source.name} 打出了(1)【醉漢】重洗手牌`,
                  (skipped.length ? `全員手牌已重發（${skipped.map(p => p.name).join('、')} 受保護未參與）` : '全員手牌已重發') + (dealt[0] ? gotCardsText(dealt[0], stNow.playerHands[0]) : ''),
                  source.name
                );
                advanceTurn();
                break;
              }

              case 'VILLAGER':
              case 'ASSASSIN':
              case 'SEER':
              case 'TAX_COLLECTOR':
              case 'INQUISITOR':
              case 'BARKEEPER':
              case 'GIRL':
              case 'THIEF':
              case 'PICKPOCKET':
              case 'SWAP_HAND':
              case 'WITCH':
              case 'BOUNTY_HUNTER':
              case 'GRAVEDIGGER':
              case 'NIGHT_WATCHMAN': {
                if (sourceId === 0) {
                  setInteractionModal({ type: card.type, card });
                } else {
                  handleAIEffectSelection(sourceId, card);
                }
                break;
              }

              default:
                logActionAndResult(`${source.name} 打出了(${card.value})【${card.title}】`, '無任何效果', source.name);
                advanceTurn();
                break;
            }
          };

          const handleAIEffectSelection = (sourceId, card) => {
            const aliveTargets = players.filter(p => p.id !== sourceId && p.status === '存活' && !p.protected);
            const sourcePlayer = players[sourceId];

            if (card.type === 'NIGHT_WATCHMAN') {
              const center = [...centerCards];
              const aiHand = playerHands[sourceId] || [];
              const combined = [...center, ...aiHand];
              const keepCard = combined.pop();
              setCenterCards(shuffle(combined));
              metaWatchman(sourceId, null, '');
              setPlayerHands(prev => ({ ...prev, [sourceId]: [keepCard] }));
              logActionAndResult(`${sourcePlayer.name} 打出了(${card.value})【守夜人】`, '檢視中央暗牌 ➔ 重新洗牌歸位', sourcePlayer.name);
              advanceTurn();
              return;
            }

            if (card.type === 'GRAVEDIGGER') {
              const validTargets = players.filter(p => (p.id === sourceId || !p.protected) && p.playedCards.some(c => c && c.type !== 'WEREWOLF'));
              if (validTargets.length > 0) {
                const target = validTargets[Math.floor(Math.random() * validTargets.length)];
                const nonWolfCards = target.playedCards.filter(c => c.type !== 'WEREWOLF');
                const stolenCard = nonWolfCards[Math.floor(Math.random() * nonWolfCards.length)];
                
                const updatedTargetPlayed = target.playedCards.filter(c => c.id !== stolenCard.id);
                setPlayers(prev => prev.map(p => p.id === target.id ? { ...p, playedCards: updatedTargetPlayed } : p));
                
                const currentAiHand = playerHands[sourceId] || [];
                setPlayerHands(prev => ({ ...prev, [sourceId]: [...currentAiHand, stolenCard] }));
                
                logActionAndResult(`${sourcePlayer.name} 對 ${target.name} 打出了(${card.value})【掘墓人】`, `奪取面前【${stolenCard.title}】`, sourcePlayer.name);
              } else {
                logActionAndResult(`${sourcePlayer.name} 打出了(${card.value})【掘墓人】`, '場上無卡牌可選 ➔ 能力失敗', sourcePlayer.name);
              }
              advanceTurn();
              return;
            }

            if (card.type === 'PICKPOCKET') {
              if (aliveTargets.length < 2) {
                logActionAndResult(`${sourcePlayer.name} 打出了(${card.value})【扒手】`, '可選對手不足 ➔ 能力無效', sourcePlayer.name);
              } else {
                const [a, b] = shuffle(aliveTargets);
                const aH = playerHands[a.id] || [];
                const bH = playerHands[b.id] || [];
                setPlayerHands(prev => ({ ...prev, [a.id]: bH, [b.id]: aH }));
                logActionAndResult(`${sourcePlayer.name} 打出了(${card.value})【扒手】`, `秘密交換了 ${a.name} 與 ${b.name} 的手牌${a.id === 0 ? gotCardsText(bH, aH) : (b.id === 0 ? gotCardsText(aH, bH) : '')}`, sourcePlayer.name);
              }
              advanceTurn();
              return;
            }

            if (aliveTargets.length === 0) {
              logActionAndResult(`${sourcePlayer.name} 打出了(${card.value})【${card.title}】`, '場面無有效目標 ➔ 能力無效', sourcePlayer.name);
              advanceTurn();
              return;
            }
            const randomTarget = aliveTargets[Math.floor(Math.random() * aliveTargets.length)];

            switch (card.type) {
              case 'BOUNTY_HUNTER': {
                let newDrawn = drawCardForPlayer(randomTarget.id, false) || reserveCards[0];
                
                const targetOldHand = (playerHands[randomTarget.id] || [])[0];
                if (targetOldHand) setPlayers(prev => prev.map(p => p.id === randomTarget.id ? { ...p, playedCards: [...p.playedCards, { ...targetOldHand, revealedBy: 'BOUNTY' }] } : p));
                setHandNow(randomTarget.id, [newDrawn]);
                
                logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${card.value})【賞金獵人】`, `強制重抽${randomTarget.id === 0 ? gotCardsText([newDrawn]) : ''}`, sourcePlayer.name, null, targetOldHand ? `${randomTarget.name} 公開手牌：(${targetOldHand.value})【${targetOldHand.title}】` : '');
                
                if (newDrawn.type === 'MAYOR' || newDrawn.type === 'WEREWOLF') {
                  logActionAndResult(`${randomTarget.name} 重抽至【${newDrawn.title}】`, `觸發死罪 ➔ ${randomTarget.name} 出局！`, randomTarget.name);
                  eliminatePlayer(randomTarget.id, sourceId, '賞金獵人抽中市長/狼人出局');
                } else if (newDrawn.type === 'VAMPIRE') {
                  const targetHighCards = (randomTarget.playedCards || []).filter(c => c && c.value >= 7);
                  if (targetHighCards.length >= 2) {
                    triggerVictory(randomTarget, '賞金獵人觸發吸血鬼降臨勝利！');
                    return;
                  }
                }
                advanceTurn();
                break;
              }
              case 'VILLAGER':
              case 'ASSASSIN': {
                const guessedVal = Math.floor(Math.random() * 11);
                executeGuess(sourceId, randomTarget.id, guessedVal, card.type === 'ASSASSIN');
                break;
              }
              case 'SEER':
                logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${card.value})【先知】`, `秘密檢視其手牌`, sourcePlayer.name);
                advanceTurn();
                break;
              case 'TAX_COLLECTOR': {
                const targetHand = playerHands[randomTarget.id] || [];
                const targetVal = targetHand[0] ? targetHand[0].value : '?';
                const isHit = targetHand.some(c => c?.value === 0 || c?.value === 1);
                logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(2)【稅務官】審查`, isHit ? `${randomTarget.name}(${targetVal})出局！` : `審查失敗 ➔ 手牌非 0 或 1`, sourcePlayer.name);
                if (isHit) eliminatePlayer(randomTarget.id, sourceId, '稅務官審查出局');
                advanceTurn();
                break;
              }
              case 'INQUISITOR': {
                const targetHand = playerHands[randomTarget.id] || [];
                const targetVal = targetHand[0] ? targetHand[0].value : '?';
                const isHit = targetHand.some(c => c?.value === 9 || c?.value === 10);
                logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(2)【審判官】審判`, isHit ? `${randomTarget.name}(${targetVal})出局！` : `審判失敗 ➔ 手牌非 9 或 10`, sourcePlayer.name);
                if (isHit) eliminatePlayer(randomTarget.id, sourceId, '審判官審判出局');
                advanceTurn();
                break;
              }
              case 'BARKEEPER':
              case 'GIRL': {
                const sHand = (playerHands[sourceId] || [])[0];
                const tHand = (playerHands[randomTarget.id] || [])[0];
                const cardVal = 3;
                const cardName = card.type === 'BARKEEPER' ? '酒保' : '小女孩';
                const cmpType = card.type === 'BARKEEPER' ? '比小' : '比大';
                if (sHand && tHand) {
                  if (card.type === 'BARKEEPER') {
                    if (sHand.value < tHand.value) {
                      logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${cardVal})【${cardName}】${cmpType}`, `${sourcePlayer.name}手牌較小出局！`, sourcePlayer.name);
                      eliminatePlayer(sourceId, randomTarget.id, '酒保比小出局');
                    } else if (tHand.value < sHand.value) {
                      logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${cardVal})【${cardName}】${cmpType}`, `${randomTarget.name}手牌較小出局！`, sourcePlayer.name);
                      eliminatePlayer(randomTarget.id, sourceId, '酒保比小出局');
                    } else {
                      logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${cardVal})【${cardName}】${cmpType}`, `平手無事發生`, sourcePlayer.name);
                    }
                  } else {
                    if (sHand.value > tHand.value) {
                      logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${cardVal})【${cardName}】${cmpType}`, `${sourcePlayer.name}手牌較大出局！`, sourcePlayer.name);
                      eliminatePlayer(sourceId, randomTarget.id, '小女孩比大出局');
                    } else if (tHand.value > sHand.value) {
                      logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${cardVal})【${cardName}】${cmpType}`, `${randomTarget.name}手牌較大出局！`, sourcePlayer.name);
                      eliminatePlayer(randomTarget.id, sourceId, '小女孩比大出局');
                    } else {
                      logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${cardVal})【${cardName}】${cmpType}`, `平手無事發生`, sourcePlayer.name);
                    }
                  }
                }
                advanceTurn();
                break;
              }
              case 'SWAP_HAND':
              case 'THIEF': {
                const sHand = playerHands[sourceId] || [];
                const tHand = playerHands[randomTarget.id] || [];
                setPlayerHands(prev => ({ ...prev, [sourceId]: tHand, [randomTarget.id]: sHand }));
                logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${card.value})【${card.title}】`, `手牌交換成功！獲得額外回合${randomTarget.id === 0 ? gotCardsText(sHand, tHand) : ''}`, sourcePlayer.name);
                setExtraTurnPlayerId(sourceId);
                advanceTurn();
                break;
              }
              case 'WITCH': {
                const deadPlayers = players.filter(p => p.status === '出局');
                if (deadPlayers.length > 0) {
                  const reviveP = deadPlayers[Math.floor(Math.random() * deadPlayers.length)];
                  const drawn = drawCardForPlayer(reviveP.id, false) || reserveCards[0];
                  setPlayerHands(prev => ({ ...prev, [reviveP.id]: [drawn] }));
                  setPlayers(prev => prev.map(p => p.id === reviveP.id ? { ...p, status: '存活', protected: false } : p));
                  setWitchTargetOwner({ witchOwnerId: sourceId, targetId: reviveP.id });
                  logActionAndResult(`${sourcePlayer.name} 打出了(${card.value})【女巫】`, `復活了 ${reviveP.name} ➔ 綁定共同勝利`, sourcePlayer.name, 'revive');
                } else {
                  logActionAndResult(`${sourcePlayer.name} 打出了(${card.value})【女巫】`, '場上無已淘汰玩家可復活 ➔ 能力無效', sourcePlayer.name);
                }
                advanceTurn();
                break;
              }
              default:
                advanceTurn();
                break;
            }
          };

          const executeGuess = (sourceId, targetId, guessedValue, isAssassin = false, skipSpy = false, secondGuessIn = null) => {
            const targetHand = (playerHands[targetId] || []).filter(Boolean);
            const target = players.find(p => p.id === targetId);
            const source = players.find(p => p.id === sourceId);
            const cardName = isAssassin ? '刺客' : '村民';
            const cardValue = isAssassin ? 0 : 1;

            // 刺客：兩次猜測（同一人）。人類自選；AI 隨機選一個不同數值
            let secondGuess = null;
            if (isAssassin) {
              if (secondGuessIn !== null && !Number.isNaN(secondGuessIn)) secondGuess = secondGuessIn;
              else {
                const pool = [...Array(11).keys()].filter(v => v !== guessedValue);
                secondGuess = pool[Math.floor(Math.random() * pool.length)];
              }
            }
            const guesses = isAssassin ? [guessedValue, secondGuess] : [guessedValue];
            const guessText = isAssassin ? `猜(${guessedValue})與(${secondGuess})` : `猜(${guessedValue})`;
            const actionText = `${source.name} 對 ${target.name} 打出了(${cardValue})【${cardName}】${guessText}`;
            const hitValue = guesses.find(g => targetHand.some(c => c.value === g));

            if (hitValue !== undefined) {
              logActionAndResult(actionText, `猜測成功！${target.name}(${hitValue}) 出局`, source.name);
              eliminatePlayer(targetId, sourceId, `遭猜中數值 ${hitValue}`);
              advanceTurn();
              return;
            }

            // 猜測未中：目標手握間諜可反殺
            const spyCardIndex = targetHand.findIndex(c => c.type === 'SPY');
            if (spyCardIndex !== -1 && !skipSpy) {
              if (targetId === 0) {
                setInteractionModal({ type: 'COUNTER_SPY', title: '間諜反殺', sourceId, targetId, guessedValue, secondGuess, isAssassin });
                return;
              }
              // AI 間諜觸發反殺：使猜測者出局，並接手其手牌
              const sourceHand = (stateRef.current.playerHands[sourceId] || []).filter(Boolean);
              setPlayers(prev => prev.map(p => p.id === targetId ? { ...p, playedCards: [...p.playedCards, targetHand[spyCardIndex]] } : p));
              logActionAndResult(actionText, `${target.name} 打出【間諜】反殺！${source.name} 出局且接手手牌`, target.name);
              eliminatePlayer(sourceId, null, '間諜反殺', true);
              setPlayerHands(prev => ({ ...prev, [targetId]: sourceHand }));
              advanceTurn();
              return;
            }

            logActionAndResult(actionText, '猜測失敗 ➔ 無事發生', source.name);
            advanceTurn();
          };

          const handleHumanInteractionSubmit = (payload) => {
            const { type, targetId, guessedValue, guessedValue2, secondaryTargetId, stolenCardId, keepCardId } = payload;
            const sourceId = 0;
            const target = players.find(p => p.id === targetId);
            setInteractionModal(null);

            if (type === 'SERVANT_CHOICE') {
              useServant(0, payload.servantId);
            } else if (type === 'VILLAGER' || type === 'ASSASSIN') {
              executeGuess(0, targetId, parseInt(guessedValue), type === 'ASSASSIN', false, type === 'ASSASSIN' ? parseInt(guessedValue2) : null);
            } else if (type === 'NIGHT_WATCHMAN') {
              const myHand = playerHands[0] || [];
              const combined = [...centerCards, ...myHand];
              const keptCard = combined.find(c => c.id === keepCardId) || combined[0];
              const remainingCenter = combined.filter(c => c.id !== keptCard.id);
              const shuffledCenter = shuffle(remainingCenter);
              setCenterCards(shuffledCenter);
              const oldHandCard = myHand[0];
              const watchNoteText = (oldHandCard && keptCard.id !== oldHandCard.id)
                ? `你換出 (${keptCard.value})【${keptCard.title}】、換入 (${oldHandCard.value})【${oldHandCard.title}】`
                : '你沒有換出中央牌（留下原本的手牌）';
              metaWatchman(0, shuffledCenter, watchNoteText);
              setPlayerHands(prev => ({ ...prev, 0: [keptCard] }));
              logActionAndResult('你 打出了(3)【守夜人】', '檢視並調整中央暗牌 ➔ 成功保留 1 張卡牌', '你');
              advanceTurn();
            } else if (type === 'GRAVEDIGGER') {
              const targetP = players.find(p => p.id === targetId);
              const stolen = targetP.playedCards.find(c => c.id === stolenCardId);
              if (stolen) {
                const updatedPlayed = targetP.playedCards.filter(c => c.id !== stolenCardId);
                setPlayers(prev => prev.map(p => p.id === targetId ? { ...p, playedCards: updatedPlayed } : p));
                setPlayerHands(prev => ({ ...prev, 0: [...(prev[0] || []), stolen] }));
                logActionAndResult(`你 對 ${targetP.name} 打出了(6)【掘墓人】`, `奪取了面前(${stolen.value})【${stolen.title}】｜已加入你的手牌`, '你');
              } else {
                logActionAndResult('你 打出了(6)【掘墓人】', '場面無可奪取之卡牌 ➔ 能力失敗', '你');
              }
              advanceTurn();
            } else if (type === 'BOUNTY_HUNTER') {
              let newDrawn = drawCardForPlayer(targetId, false) || reserveCards[0];
              
              const targetOldHand = (playerHands[targetId] || [])[0];
              if (targetOldHand) setPlayers(prev => prev.map(p => p.id === targetId ? { ...p, playedCards: [...p.playedCards, { ...targetOldHand, revealedBy: 'BOUNTY' }] } : p));
              setHandNow(targetId, [newDrawn]);
              logActionAndResult(`你 對 ${targetId === 0 ? '自己' : target.name} 打出了(5)【賞金獵人】`, `強制重抽${targetId === 0 ? gotCardsText([newDrawn]) : ''}`, '你', null, targetOldHand ? `${target.name} 公開手牌：(${targetOldHand.value})【${targetOldHand.title}】` : '');

              if (newDrawn.type === 'MAYOR' || newDrawn.type === 'WEREWOLF') {
                logActionAndResult(`${target.name} 重抽至【${newDrawn.title}】`, `觸發死罪 ➔ ${target.name} 出局！`, target.name);
                eliminatePlayer(targetId, 0, '賞金獵人抽中市長/狼人出局');
              } else if (newDrawn.type === 'VAMPIRE') {
                const targetHighCards = (target.playedCards || []).filter(c => c && c.value >= 7);
                if (targetHighCards.length >= 2) {
                  triggerVictory(target, '賞金獵人觸發吸血鬼降臨勝利！');
                  return;
                }
              }
              advanceTurn();
            } else if (type === 'SEER') {
              const targetHand = playerHands[targetId] || [];
              const cName = targetHand[0] ? targetHand[0].title : '無';
              const cVal = targetHand[0] ? targetHand[0].value : '?';
              logActionAndResult(`你 對 ${target.name} 打出了(2)【先知】`, `秘密檢視結果 ➔ ${target.name} 手牌為 ${cName}(${cVal})`, '你');
              setInteractionModal({ type: 'INFO', title: '先知檢視結果', message: `玩家 ${target.name} 的手牌為：${cName} (數值 ${cVal})` });
              return;
              advanceTurn();
            } else if (type === 'TAX_COLLECTOR') {
              const targetHand = playerHands[targetId] || [];
              const targetVal = targetHand[0] ? targetHand[0].value : '?';
              const isHit = targetHand.some(c => c.value === 0 || c.value === 1);
              logActionAndResult(`你 對 ${target.name} 打出了(2)【稅務官】審查`, isHit ? `${target.name}(${targetVal})手牌符合 ➔ 宣佈出局！` : `審查失敗 ➔ ${target.name} 手牌非 0 或 1`, '你');
              if (isHit) eliminatePlayer(targetId, 0, '稅務官審查出局');
              advanceTurn();
            } else if (type === 'INQUISITOR') {
              const targetHand = playerHands[targetId] || [];
              const targetVal = targetHand[0] ? targetHand[0].value : '?';
              const isHit = targetHand.some(c => c.value === 9 || c.value === 10);
              logActionAndResult(`你 對 ${target.name} 打出了(2)【審判官】審判`, isHit ? `${target.name}(${targetVal})手牌符合 ➔ 宣佈出局！` : `審判失敗 ➔ ${target.name} 手牌非 9 或 10`, '你');
              if (isHit) eliminatePlayer(targetId, 0, '審判官審判出局');
              advanceTurn();
            } else if (type === 'BARKEEPER' || type === 'GIRL') {
              const sHand = (playerHands[0] || [])[0];
              const tHand = (playerHands[targetId] || [])[0];
              const cName = type === 'BARKEEPER' ? '酒保' : '小女孩';
              if (sHand && tHand) {
                if (type === 'BARKEEPER') {
                  if (sHand.value < tHand.value) {
                    logActionAndResult(`你 對 ${target.name} 打出了(3)【${cName}】比小`, `你的手牌(${sHand.value})較小 ➔ 你出局！`, '你');
                    eliminatePlayer(0, targetId, '酒保比小出局');
                  } else if (tHand.value < sHand.value) {
                    logActionAndResult(`你 對 ${target.name} 打出了(3)【${cName}】比小`, `${target.name}手牌(${tHand.value})較小 ➔ ${target.name}出局！`, '你');
                    eliminatePlayer(targetId, 0, '酒保比小出局');
                  } else {
                    logActionAndResult(`你 對 ${target.name} 打出了(3)【${cName}】比小`, `雙方數值相同 ➔ 平手無事發生`, '你');
                  }
                } else {
                  if (sHand.value > tHand.value) {
                    logActionAndResult(`你 對 ${target.name} 打出了(3)【${cName}】比大`, `你的手牌(${sHand.value})較大 ➔ 你出局！`, '你');
                    eliminatePlayer(0, targetId, '小女孩比大出局');
                  } else if (tHand.value > sHand.value) {
                    logActionAndResult(`你 對 ${target.name} 打出了(3)【${cName}】比大`, `${target.name}手牌(${tHand.value})較大 ➔ ${target.name}出局！`, '你');
                    eliminatePlayer(targetId, 0, '小女孩比大出局');
                  } else {
                    logActionAndResult(`你 對 ${target.name} 打出了(3)【${cName}】比大`, `雙方數值相同 ➔ 平手無事發生`, '你');
                  }
                }
              }
              advanceTurn();
            } else if (type === 'THIEF' || type === 'SWAP_HAND') {
              const sHand = playerHands[0] || [];
              const tHand = playerHands[targetId] || [];
              setPlayerHands(prev => ({ ...prev, 0: tHand, [targetId]: sHand }));
              logActionAndResult(`你 對 ${target.name} 打出了(7)【小偷】`, `手牌交換成功！獲得額外回合${gotCardsText(tHand, sHand)}`, '你');
              setExtraTurnPlayerId(0);
              advanceTurn();
            } else if (type === 'PICKPOCKET') {
              const t1 = players.find(p => p.id === targetId);
              const t2 = players.find(p => p.id === secondaryTargetId);
              const t1Hand = playerHands[targetId] || [];
              const t2Hand = playerHands[secondaryTargetId] || [];
              setPlayerHands(prev => ({ ...prev, [targetId]: t2Hand, [secondaryTargetId]: t1Hand }));
              logActionAndResult(`你 打出了(6)【扒手】`, `秘密交換了 ${t1.name} 與 ${t2.name} 的手牌`, '你');
              advanceTurn();
            } else if (type === 'WITCH') {
              const deadTargets = players.filter(p => p.status === '出局');
              if (deadTargets.length > 0 && targetId !== undefined && target) {
                const drawn = drawCardForPlayer(targetId, false) || reserveCards[0];
                setPlayerHands(prev => ({ ...prev, [targetId]: [drawn] }));
                setPlayers(prev => prev.map(p => p.id === targetId ? { ...p, status: '存活', protected: false } : p));
                setWitchTargetOwner({ witchOwnerId: 0, targetId });
                logActionAndResult(`你 打出了(4)【女巫】`, `復活了 ${target.name} ➔ 綁定共同勝利`, '你', 'revive');
              } else {
                logActionAndResult('你 打出了(4)【女巫】', '場上無已淘汰玩家可復活 ➔ 能力無效', '你');
              }
              advanceTurn();
            } else if (type === 'COUNTER_SPY') {
              const attacker = players.find(p => p.id === payload.attackerId);
              const attackerHand = playerHands[payload.attackerId] || [];
              logActionAndResult('你 打出了(7)【間諜】', `反殺猜測者 ${attacker.name}！該玩家淘汰並奪取其手牌`, '你');
              eliminatePlayer(payload.attackerId, null, '間諜反殺出局', true);
              const spyC = (playerHands[0] || []).find(c => c && c.type === 'SPY');
              if (spyC) setPlayers(prev => prev.map(p => p.id === 0 ? { ...p, playedCards: [...p.playedCards, spyC] } : p));
              setPlayerHands(prev => ({ ...prev, 0: attackerHand.filter(Boolean) }));
              advanceTurn();
            }
          };

          const proceedToNext = (forceExtra = null) => {
            lockRef.current = false;
            setActionLocked(false);
            const st = stateRef.current;
            const extra = forceExtra !== null ? forceExtra : st.extraTurnPlayerId;
            let nextIdx;
            if (extra !== null && st.players[extra] && st.players[extra].status === '存活') nextIdx = extra;
            else nextIdx = getNextAliveIndex(st.currentTurnIndex, st.players);
            setExtraTurnPlayerId(null);
            // 保鏢：下個回合開始時解除保護
            setPlayers(prev => prev.map(p => p.id === nextIdx ? { ...p, protected: false } : p));
            setCurrentTurnIndex(nextIdx);
            setTurnTick(t => t + 1);
            
          };

          const useServant = (pid, servantId) => {
            const p = stateRef.current.players.find(x => x.id === pid);
            setPlayers(prev => prev.map(x => x.id === pid ? { ...x, playedCards: x.playedCards.filter(c => !(c && c.id === servantId)) } : x));
            logActionAndResult(`${p.name} 棄掉面前【僕人】`, '立刻進行額外回合！', p.name);
            proceedToNext(pid);
          };

          const advanceTurn = () => {
            const st0 = stateRef.current;
            const delay = st0.players[st0.currentTurnIndex]?.isAI ? 3000 : 1200;
            setTimeout(() => {
              if (gameOverRef.current) return;
              if (checkWinConditions()) return;
              const st = stateRef.current;
              const cur = st.players[st.currentTurnIndex];
              if (cur && cur.status === '存活' && st.extraTurnPlayerId === null) {
                const servant = cur.playedCards.find(c => c && c.type === 'SERVANT');
                if (servant) {
                  if (cur.isAI) { useServant(cur.id, servant.id); return; }
                  setInteractionModal({ type: 'SERVANT_CHOICE', title: '僕人', servantId: servant.id });
                  return;
                }
              }
              proceedToNext();
            }, delay);
          };

          useEffect(() => {
            if (gameOver) return;

            // 僅在遊戲開始且牌庫真為0時檢查結算，防止初始化階段誤觸發
            if (deck.length === 0 && playerHands[0] && playerHands[0].length > 0) {
              const alivePlayers = players.filter(p => p.status === '存活');
              resolveDeckEmptyVictory(alivePlayers);
              return;
            }

            const currentPlayer = players[currentTurnIndex];
            if (!currentPlayer) return;

            if (currentPlayer.status === '出局') {
              advanceTurn();
              return;
            }

            if (currentPlayer.isAI) {
              if (pausedRef.current) { pendingAiRef.current = true; return; }
              const aiTimer = setTimeout(async () => {
                if (pausedRef.current) { pendingAiRef.current = true; return; }
                pendingAiRef.current = false;
                const myToken = ++aiRunRef.current;
                const stale = () => gameOverRef.current || aiRunRef.current !== myToken;
                const sleep = (ms) => new Promise(r => setTimeout(r, ms));
                const pid = currentPlayer.id;

                let hand = (stateRef.current.playerHands[pid] || []).filter(Boolean);
                let drawnCard = null;
                while (hand.length < 2 && stateRef.current.deck.length > 0) {
                  if (hand.length === 1 && stateRef.current.centerCards.some(Boolean) && Math.random() < 0.25) {
                    aiCenterSwap(pid);
                    return;
                  }
                  const result = drawTurnCard(pid);
                  if (result.gameEnded || gameOverRef.current) return;
                  if (result.card) { drawnCard = result.card; break; }
                  if (result.moon) {
                    // 月亮牌展示停留 3 秒，讓玩家看清楚，再抽下一張
                    await sleep(3000);
                    while (pausedRef.current && !stale()) await sleep(300);
                    if (stale()) return;
                    continue;
                  }
                  break;
                }

                if (drawnCard) {
                  hand = [...hand, drawnCard];
                  setHandNow(pid, hand);
                }

                if (hand.length >= 2) {
                  const safeCard = hand.find(c => c?.type && c.type !== 'WEREWOLF' && c.type !== 'MAYOR') || hand[0];
                  if (safeCard) executePlayPhase(pid, safeCard);
                  else advanceTurn();
                } else {
                  advanceTurn();
                }
              }, 1200);

              return () => clearTimeout(aiTimer);
            }
          }, [currentTurnIndex, gameOver, turnTick]);

          const myHand = playerHands[0] || [];
          resolveRef.current = resolveCardEffect;

          // 面前的牌：該玩家所有打出（或被公開）而放在面前的牌；同一張牌只列一次
          const getFrontCards = (p) => {
            const map = new Map();
            const order = [];
            (p.playedCards || []).forEach((c, idx) => {
              if (!c) return;
              const key = c.id || `${c.title}-${idx}`;
              const prev = map.get(key);
              if (!prev) order.push(key);
              map.set(key, { ...c, revealedBy: c.revealedBy || (prev && prev.revealedBy) });
            });
            return order.map(k => map.get(k));
          };

          // 長期有效、仍在作用的牌 ➔ 標示「生效中」：僕人、商人、煉金術士、保鏢（保護期間）、
          // 仍握在手上的賞金獵人公開牌、女巫（復活者仍綁定時）
          const isCardActive = (p, c) => {
            if (!p || !c || p.status !== '存活') return false;
            if (c.type === 'SERVANT' || c.title === '商人' || c.title === '煉金術士') return true;
            if (c.type === 'BODYGUARD') return !!p.protected;
            if (c.revealedBy === 'BOUNTY') return (playerHands[p.id] || []).some(h => h && h.id === c.id);
            if (c.title === '女巫') return !!witchTargetOwner && witchTargetOwner.witchOwnerId === p.id;
            return false;
          };

          const handleNextGame = () => {
            if (winnerInfo && winnerInfo.matchWinners && winnerInfo.matchWinners.length > 0) { winsRef.current = {}; setWins({}); }
            initGame();
          };
          const nextGameLabel = (winnerInfo && winnerInfo.matchWinners && winnerInfo.matchWinners.length > 0) ? '開始新的一場' : '下一局';

          // 結算後攤牌：單張牌的小標籤
          const revealChip = (c, key) => c ? (
            <span key={key} className="inline-flex items-center bg-slate-800 border border-amber-500/40 rounded px-1.5 py-0.5 text-[10.5px] whitespace-nowrap">{numEmoji(c.value)}<b className="font-black text-amber-300 ml-0.5">{c.title}</b></span>
          ) : (
            <span key={key} className="inline-flex items-center bg-slate-800/50 border border-dashed border-slate-600 rounded px-1.5 py-0.5 text-[10px] text-slate-500 whitespace-nowrap">已取走</span>
          );

          const toggleAiPause = () => {
            const next = !pausedRef.current;
            pausedRef.current = next;
            setAiPaused(next);
            if (!next && pendingAiRef.current) {
              pendingAiRef.current = false;
              setTurnTick(t => t + 1);
            }
          };

          return (
            <div className="min-h-[100dvh] h-[100dvh] w-screen flex flex-col justify-between overflow-hidden bg-slate-950 text-slate-100 select-none touch-manipulation pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)] pl-[env(safe-area-inset-left)] pr-[env(safe-area-inset-right)]">
              
              <div className="mobile-container h-full w-full max-w-[480px] mx-auto flex flex-col justify-between bg-gradient-to-b from-slate-900 via-slate-950 to-slate-900 relative">

                {/* A區: 頂部狀態列 */}
                <header className="h-[4.5%] min-h-[32px] bg-slate-900/90 backdrop-blur border-b border-cyan-900/40 px-3 flex items-center justify-between z-20 shrink-0">
                  <div className="flex items-center">
                    <span className="text-[10px] font-mono font-bold text-cyan-400 tracking-tight">
                      {version}
                    </span>
                  </div>
                  {gameOver && winnerInfo && (
                    <button onClick={handleNextGame} className="flex items-center space-x-1 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 text-[10px] font-black px-2.5 py-0.5 rounded-md shadow active:scale-95 animate-pulse">
                      <i className="fa-solid fa-forward-step text-[9px]"></i><span>{nextGameLabel}</span>
                    </button>
                  )}
                  <div className="flex items-center space-x-2">
                    <button onClick={toggleAiPause} className={`flex items-center space-x-1.5 border text-[11px] px-2 py-0.5 rounded-md shadow-sm active:scale-95 ${aiPaused ? 'bg-amber-500/20 border-amber-400/70 text-amber-300' : 'bg-slate-800/90 border-slate-500/50 text-slate-300'}`}>
                      <i className={`fa-solid ${aiPaused ? 'fa-play' : 'fa-pause'} text-[10px]`}></i>
                      <span className="font-bold text-[10px]">{aiPaused ? '繼續' : '暫停'}</span>
                    </button>
                    <button onClick={() => setIsRulesModalOpen(true)} className="flex items-center space-x-1.5 bg-slate-800/90 border border-amber-500/40 text-amber-300 text-[11px] px-2 py-0.5 rounded-md shadow-sm active:scale-95">
                      <i className="fa-solid fa-book-open text-amber-400 text-[10px]"></i>
                      <span className="font-bold text-[10px]">規則</span>
                    </button>
                    <button onClick={() => setIsDeckModalOpen(true)} className="flex items-center space-x-1.5 bg-slate-800/90 border border-cyan-500/40 text-cyan-300 text-[11px] px-2 py-0.5 rounded-md shadow-sm active:scale-95">
                      <i className="fa-solid fa-layer-group text-cyan-400 text-[10px]"></i>
                      <span className="font-bold text-[10px]">牌庫</span>
                      <span className="font-mono font-bold text-amber-300 ml-0.5">
                        {deck.length}
                      </span>
                    </button>
                    <button onClick={() => setIsHistoryModalOpen(true)} className="flex items-center space-x-1.5 bg-slate-800/90 border border-purple-500/40 text-purple-300 text-[11px] px-2 py-0.5 rounded-md shadow-sm active:scale-95">
                      <i className="fa-solid fa-clock-rotate-left text-purple-400 text-[10px]"></i>
                      <span className="font-bold text-[10px]">紀錄</span>
                    </button>
                  </div>
                </header>

                {/* B區: 玩家頭像區 */}
                <section className="h-[10.5%] min-h-[64px] bg-slate-900/60 border-b border-slate-800/80 px-1.5 py-1.5 flex items-center overflow-x-auto gap-1.5 shrink-0 scrollbar-none">
                  {players.map((player, idx) => {
                    const isTurn = currentTurnIndex === idx;
                    const isDead = player.status === '出局';
                    return (
                      <div 
                        key={player.id}
                        onClick={() => setViewPlayerId(player.id)}
                        className={`cursor-pointer player-box min-w-[54px] flex-1 bg-slate-800/70 rounded-lg p-1 flex flex-col items-center justify-center relative transition-all duration-300 ${
                          isTurn ? 'border-2 border-emerald-500/80 shadow-lg scale-[1.02]' : 'border border-slate-700/60 opacity-85'
                        } ${isDead ? 'grayscale opacity-30' : ''}`}
                      >
                        <div className={`turn-indicator absolute -top-1 -right-1 w-3 h-3 rounded-full bg-slate-900 border flex items-center justify-center ${isTurn ? 'border-emerald-400 turn-active-glow' : 'border-slate-700'}`}>
                          <span className={`light-dot rounded-full ${isTurn ? 'w-1.5 h-1.5 bg-emerald-400 animate-pulse' : 'w-1 h-1 bg-slate-500'}`}></span>
                        </div>
                        <div className="relative inline-block mb-1">
                          <div className={`w-7 h-7 rounded-full bg-gradient-to-tr ${player.gradient} p-0.5 shadow`}>
                            <img src={`https://api.dicebear.com/7.x/bottts/svg?seed=${player.seed}`} alt={player.name} className="w-full h-full rounded-full bg-slate-900" />
                          </div>
                          {(wins[player.id] || 0) > 0 && (
                            <div className="absolute -top-1 -left-2.5 z-10 h-3.5 px-1 rounded-full bg-slate-900 border border-amber-300/80 text-amber-300 flex items-center gap-px text-[7px] leading-none">

          const unseenText = (v) => {
            const myTitles = (playerHands[0] || []).filter(Boolean).map(c => c.title);

              const base = ((remainingCounts || {})[c.title] || { current: c.totalCount }).current;

              return n > 0 ? `${c.title}${n > 1 ? '×' + n : ''}` : null;
            }).filter(Boolean);
            return parts.length ? parts.join('、') : '已無';
          };

          // 掘墓人選定的玩家面前可奪取卡牌
          const gravediggerTarget = players.find(p => p.id.toString() === selectedTarget);
          const availableStolenCards = gravediggerTarget ? gravediggerTarget.playedCards.filter(c => c && c.type !== 'WEREWOLF') : [];

          // 守夜人可選擇的卡牌組合 (手牌 + 中央暗牌)
          const watchmanHand = playerHands[0] || [];
          const watchmanOptions = [...centerCards, ...watchmanHand].filter(Boolean);

          return (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
